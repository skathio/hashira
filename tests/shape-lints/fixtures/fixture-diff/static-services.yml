# Must fail: a services block on the static deploy job.
name: ci
on:
  push:
permissions: {}
jobs:
  ci:
    uses: skathio/hashira/.github/workflows/static-webapp-ci.yml@v3
    permissions:
      contents: read # check out the repository
  deploy:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: github-pages
    services:
      extra:
        image: nginx
    permissions:
      pages: write # deploy-pages publishes the site
    steps:
      - uses: skathio/hashira/.github/actions/pages-deploy@v3
        id: deploy
      - run: curl -fsSL "${{ steps.deploy.outputs.page_url }}marker.txt"
