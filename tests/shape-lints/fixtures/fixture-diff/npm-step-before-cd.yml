# Must fail: a step added before npm-release.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  ci:
    uses: skathio/hashira/.github/workflows/npm-package-ci.yml@0123456789abcdef0123456789abcdef01234567
    permissions:
      contents: read # check out the repository
  publish:
    needs: ci
    if: needs.ci.outputs.resolved_version != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # create the release tag and GitHub Release
    services:
      verdaccio:
        image: verdaccio/verdaccio@sha256:d394c36d62a62d264cf5566eabe323050f3e0a3f6455ccff9c355fcbfcb28073
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: echo injected
      - uses: skathio/hashira/.github/actions/npm-release@0123456789abcdef0123456789abcdef01234567
        id: release
        with:
          version: ${{ needs.ci.outputs.resolved_version }}
          target: http://localhost:4873
          auth: token
          npm_token: throwaway
      - run: npm install fixture@${{ needs.ci.outputs.resolved_version }}
