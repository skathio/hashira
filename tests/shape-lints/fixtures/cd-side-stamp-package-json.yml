# Negative-test fixture (phase 5 iteration 5.1, CHECK 2).
#
# A deliberately introduced `npm pkg set` step inside an otherwise-ordinary
# CD composite action. Phase 3.4 established that a CD composite
# (npm-release) must NEVER write/re-stamp package.json — it consumes the
# CI-stamped, byte-identical tarball as-is (NFR-Rel-1). This fixture exists
# ONLY to prove the no-CD-stamp check fails closed on this exact pattern.
# Not a real composite action; never wired into any real workflow.
name: fixture-cd-side-stamp-package-json
description: Negative-test fixture for tests/shape-lints/no-nested-reusable-workflow.py CHECK 2 (package.json stamp).

inputs:
  version:
    description: "Placeholder input, mirrors the real CD composites' shape."
    required: true

runs:
  using: composite
  steps:
    - name: Innocuous setup step
      shell: bash
      run: |
        echo "setting up"
    - name: Deliberately prohibited CD-side version stamp
      shell: bash
      env:
        FX_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        npm pkg set version="${FX_VERSION}"
