# Deploys hashira's own project page and docs to GitHub Pages (https://skathio.github.io/hashira/)
# through pages-site.yml, the reusable workflow consumers call for theirs.
#
# One release, one approval. release.yml calls this after its `publish` job, which already passed
# the `production` Environment's owner approval, so the site goes out after the tags and the
# Release with no second approval (`released: true` skips pages-site's `gate`). Run by hand, for
# a page-only fix, it waits at that gate for the same approval. There is no push trigger: a
# deploy is always a release or an approved run, so the published docs match the released
# version.
#
# pages-site.yml does the rest: it refuses any ref but main before the approval, copies site/
# (the landing page), adds the site kit in `_kit/`, builds the docs from docs/ and
# .github/pages.json into `docs/`, uploads, and deploys; a released run deploys only while its
# commit holds the highest vX.Y.Z tag. It is called from this repo (`./`), so its
# `job.workflow_sha` is this run's commit and the kit and docs-build come from the same commit
# as the pages they build. A deploy that fails after the release's tags are pushed is not
# retried here: re-run this workflow by hand, approved in `production`.
name: site

on:
  workflow_dispatch:
    inputs:
      # A boolean here too, so `inputs.released` is false, not null, on a hand run when it is
      # passed to pages-site.yml's boolean input. `check` refuses true on a hand run.
      released:
        description: "Leave unchecked. Only release.yml deploys without the approval; a hand run with this set is refused."
        type: boolean
        default: false
  workflow_call:
    inputs:
      released:
        description: "true only from release.yml's `site` job, whose `publish` job already passed the production approval."
        type: boolean
        default: false

permissions: {}

jobs:
  # `released: true` skips the approval, so only release.yml may pass it. A called workflow sees
  # the caller's github context: github.workflow_ref names release.yml on a release run and
  # site.yml on a hand run.
  check:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse released on anything but a release run
        env:
          RELEASED: ${{ inputs.released }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml@
        run: |
          if [ "${RELEASED}" = "true" ] && [[ "${WORKFLOW_REF}" != "${RELEASE_WORKFLOW}"* ]]; then
            echo "::error::site: released is for release.yml only; this run is ${WORKFLOW_REF}." >&2
            exit 1
          fi

  site:
    needs: check
    # pages-site.yml's build job reads the repo; its deploy job publishes to Pages and proves
    # itself with OIDC. A called workflow's jobs get no more than this.
    permissions:
      contents: read   # pages-site build: checkout
      pages: write     # pages-site deploy: deploy-pages
      id-token: write  # pages-site deploy: deploy-pages authenticates via OIDC
    uses: ./.github/workflows/pages-site.yml
    with:
      released: ${{ inputs.released }}
