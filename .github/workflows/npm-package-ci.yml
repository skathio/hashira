# Reusable workflow: npm-package-ci (CI half of the npm flow per D8).
#
# Runs lint (with inline non-blocking commitlint warning per D11) + test
# (coverage is reported INSIDE this job — see the `test` job below) +
# scan-suite. No publish step. The Publish half is the `npm-release`
# composite action (`.github/actions/npm-release/`), invoked from the
# consumer's own publish.yml job (see docs/flows/npm.md).
#
# Coverage reporting was originally a separate `coverage-report` job, but
# that ran on a fresh runner with no artifact handoff from `test` and
# always failed "file not found" — the same bug class found and fixed in
# `nuget-package-ci.yml` (hashira-v2 iteration 6.5), discovered here via
# somi's live iteration 6.1/6.2 migration. Removed; coverage reporting now
# runs as the last step of `test`, in the same workspace `run-tests-js`
# wrote the coverage file to.
#
# ## Version resolution + stamp (D1/D8, iteration 2.2)
#
# A `version` job, gated at the JOB level on `inputs.bump != ''`, resolves the
# next release version via `.github/actions/version-resolver` and stamps it
# into an `npm pack`-built tarball — never into the checked-out working tree
# (D1's stamp-only, no-commit-back invariant; verified by a `git status`
# assertion step). When `bump` is empty (every routine PR/push CI run that
# isn't cutting a release) the `version` job is skipped entirely and every
# other job runs exactly as before this iteration — `version` neither gates
# nor is gated by `lint`/`test`/`scan-suite`.
#
# CI->CD output-boundary contract (D8, phase 2 exit criteria "Major 3 fix"):
# this workflow declares exactly ONE workflow-level output, `resolved_version`
# — the resolver's single scalar, mapped straight through
# (`jobs.version.outputs.resolved_version` <- `steps.resolve.outputs.version`).
# No second output for the `v`-prefixed tag form or the bump kind. A
# consumer's CD job reads it via
# `needs.<this-job-id>.outputs.resolved_version` and derives the `v`-prefix
# itself (`v${{ needs.ci.outputs.resolved_version }}`) — this exact "second
# output for convenience" mistake has been flagged across three review
# passes (discovery, plan-review, phase 2.1's own architecture review).
#
# ## Same-run artifact handoff (sdd.md §8 open item, resolved iter 2.2 pass 2)
#
# The packed tarball (`${RUNNER_TEMP}/hashira-pack-output/*.tgz`) is uploaded
# via `actions/upload-artifact` under the stable name `npm-tarball`,
# `retention-days: 5`. Phase 3's CD job downloads this exact artifact by name
# (`actions/download-artifact`) to publish — it MUST NOT re-pack from a fresh
# checkout, which would silently break the byte-identical guarantee
# NFR-Rel-1 requires (the CD job's checkout happens on a different runner,
# potentially after further commits land on the branch). 5 days covers the
# gap between a CI release run and a maintainer triggering/approving the CD
# publish job (FR-8: re-publish without re-running CI) without keeping
# stale release tarballs indefinitely.
#
# ## Permissions baseline (NF6)
#
# Workflow-level `permissions: {}` (deny-all). Each job grants the minimum
# it needs:
#   - version : contents:read (resolver + pack/stamp; no working-tree write)
#   - lint  : contents:read, pull-requests:write   (commitlint sticky-comment)
#   - test  : contents:read, pull-requests:write (coverage-report sticky
#             comment, run as the last step of this job — see below)
#   - scan-suite : contents:read, security-events:write (CodeQL),
#                  pull-requests:read (dependency-review on PR)
#
# Reusable workflows can only NARROW the caller's grants, never broaden.
# Consumers must mirror this matrix at their caller job's `permissions:`
# block (documented in docs/usage.md and docs/flows/npm.md).
#
# ## Inline commitlint (D11, non-blocking)
#
# On pull_request events the `lint` job runs `npx commitlint` over the PR
# range. Findings post a sticky PR comment via actions/github-script using
# the marker pattern that coverage-report established. The step is
# non-blocking — exit 0 regardless of commitlint findings (D11: "warns,
# does not block"). The commitlint CLI + config-conventional are pinned
# inside this workflow's `npx` invocation; see the npm supply-chain trust
# model documented at the top of
# `.github/actions/npm-release/action.yml` — the same trust
# gap applies (npm has no SHA-pin equivalent; integrity rests on the
# registry-side hash verified at install time).
#
# ## Secret preflight (spec §8)
#
# The CI half has no required secrets (consumer-provided test_command may
# call out to private registries via the caller's env, but the workflow
# itself doesn't gate-check anything). A no-op `preflight` step exists in
# the `setup` job documenting the pattern — the Publish half copies the
# structure for real secret presence/non-empty/shape checks.
#
# ## SHA pins (NF2)
#
# All third-party `uses:` refs are pinned to a full 40-char commit SHA
# with an inline version comment. Pins reused from iter 1.2 / 2.1.
#
# ## Runtime contract: library-self-checkout via `library_ref` (D14)
#
# In-repo composite actions live at `.github/actions/<name>` in the
# `skathio/hashira` repo. When this workflow is invoked from a
# consumer repo, the consumer's `$GITHUB_WORKSPACE` contains the
# consumer's files, not the library's. GitHub's `uses:` keyword does NOT
# permit expressions in the `@<ref>` portion (workflow-load-time parse,
# before expression evaluation), so the originally-proposed shape
# `uses: skathio/hashira/.github/actions/<name>@${{ inputs.library_ref }}`
# is rejected by the runtime.
#
# Resolution (D14): every job that consumes an in-repo composite action
# first checks out `skathio/hashira` at `${{ inputs.library_ref }}`
# into the reserved subdirectory `.hashira/`. The composite-action
# `uses:` refs are then literal local paths
# `uses: ./.hashira/.github/actions/<name>` (no expressions, satisfies
# the load-time parser). The `library_ref` is substituted at runtime
# through `actions/checkout`'s `ref:` input (where expressions ARE
# permitted because it's a step input, not the `uses:` keyword itself).
#
# `library_ref` is a REQUIRED input (no default) as of v2 phase 1
# iteration 1.1 — see decisions.md D9 / phases/01-naming-unification.md.
# v1's default ('v1', with a stale comment claiming 'main') was a
# consumer-visible contract mismatch; rather than pick a new default to
# defend, every caller must now pin explicitly. This is a
# breaking-contract change for any v1 caller relying on the implicit
# default; callers MUST pass `library_ref` explicitly going forward.
#
# Trade-off: ~1–2s overhead per job for the library checkout. Acceptable
# at v1; documented as the cost of the literal-`uses:` constraint.

name: npm-package-ci

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node major to install via actions/setup-node."
        required: false
        type: string
        default: "20"
      test_command:
        description: "Shell command that runs the consumer's tests. Trusted input (raw-shell sink per D10d; do NOT pass values derived from PR titles, issue bodies, branch names, or other externally controlled context)."
        required: false
        type: string
        default: "npm test"
      coverage_path:
        description: "Path to the lcov coverage file produced by test_command. Default 'coverage/lcov.info'."
        required: false
        type: string
        default: "coverage/lcov.info"
      scan_disable:
        description: "Comma-separated list of scans to skip (D10c). Default 'codeql,actionlint' — pass '' to enable all. Values: codeql,osv,gitleaks,dependency-review,actionlint."
        required: false
        type: string
        default: "codeql,actionlint"
      library_ref:
        description: "SHA, tag, or branch of skathio/hashira to check out for in-repo composite actions (D14). REQUIRED — no default (v2 phase 1 iteration 1.1). PIN TO A SHA for reproducible consumer builds."
        required: true
        type: string
      bump:
        description: "One of 'patch' | 'minor' | 'major'. OPTIONAL — leave empty/unset for routine PR/push CI runs that aren't cutting a release. When set, the version job resolves the next version, surfaces it in the run summary, and stamps it into a packed tarball's package.json (D1/D8). Empty by default so every non-release CI run is unaffected."
        required: false
        type: string
        default: ""
      seed_version:
        description: "Bare semver baseline (e.g. '0.0.0') for a major/initial release with no prior stable tag (FR-3). Passed through to the version-resolver action unchanged; ignored when a stable tag already exists or when 'bump' is empty."
        required: false
        type: string
        default: ""
    outputs:
      # CI->CD output-boundary contract (D8 / phases/02-version-resolver.md
      # exit criteria, "Major 3 fix"): exactly ONE workflow-level output,
      # mapped straight through from the version job's single scalar. No
      # second output for the `v`-prefixed tag form or the bump kind — the
      # consumer's CD job derives those locally
      # (`v${{ needs.<ci-job-id>.outputs.resolved_version }}`, and `bump` is
      # already its own dispatch input). Empty when `bump` was not provided
      # (the `version` job did not run).
      resolved_version:
        description: "The resolved, validated bare semver string (e.g. '1.3.0', no 'v' prefix). Empty when 'bump' was not provided. The workflow's only output (D8)."
        value: ${{ jobs.version.outputs.resolved_version }}

# Deny-all baseline; jobs grant the minimum.
permissions: {}

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node_version }}
      - name: Secret preflight (no-op for CI half)
        shell: bash
        run: |
          set -euo pipefail
          # CI half requires no secrets. The preflight pattern is documented
          # here for symmetry with the Publish half which validates
          # NPM_TOKEN presence + shape per spec §8.
          echo "npm-package-ci: secret preflight (no secrets required for CI)"

  # Resolves + stamps the release version (D1/D8). Gated at the JOB level on
  # `inputs.bump != ''` so a routine PR/push CI run (bump unset) skips this
  # job entirely — no resolver invocation, no checkout-with-full-tags, no
  # pack/stamp work — and shows as "skipped" rather than running pointless
  # steps behind a step-level `if:`. Deliberately independent of `setup`/
  # `lint`/`test`/`scan-suite`: nothing here gates them and nothing here is
  # gated by them, so existing CI behavior for non-release runs is provably
  # unaffected by this job's presence.
  version:
    name: version
    if: ${{ inputs.bump != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      resolved_version: ${{ steps.resolve.outputs.version }}
    steps:
      # actions/checkout v4.2.2 — consumer's tree. Full history + tags
      # (fetch-depth: 0, fetch-tags: true) so the resolver can see the real
      # tag list via `git tag --list` below; the other jobs' shallow
      # checkout is intentionally left as-is (they don't need tag history).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      # Library self-checkout per D14: ./.hashira/ holds hashira at library_ref.
      - name: Checkout hashira library (D14)
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ inputs.library_ref }}
          path: .hashira
          persist-credentials: false
      # actions/setup-node v4.1.0 — needed for `npm pack`/`npm pkg set` below.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node_version }}
      - name: Gather tag list
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          # Newline-separated tag list, the shape version-resolver expects
          # (security.md B7: passed via env below, never interpolated into
          # a `run:` string by the resolver itself).
          tag_list="$(git tag --list)"
          {
            echo "tags<<HASHIRA_TAGS_EOF"
            echo "${tag_list}"
            echo "HASHIRA_TAGS_EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Resolve next version
        id: resolve
        uses: ./.hashira/.github/actions/version-resolver
        with:
          tags: ${{ steps.tags.outputs.tags }}
          bump: ${{ inputs.bump }}
          seed_version: ${{ inputs.seed_version }}
      - name: Surface resolved version in run summary (NFR-DX-3)
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          echo "npm-package-ci: resolved version ${RESOLVED_VERSION} (bump=${BUMP})" >> "${GITHUB_STEP_SUMMARY}"
      - name: Pack tarball with stamped version (D1 — stamp-only, no commit-back)
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Stamp + pack in an ISOLATED COPY of the working tree, never the
          # checked-out tree itself. This is the mechanism that makes the
          # "no commit-back" invariant (D1) true by construction rather than
          # by discipline: package.json in $GITHUB_WORKSPACE is never opened
          # for writing.
          pack_dir="${RUNNER_TEMP}/hashira-pack"
          rm -rf "${pack_dir}"
          mkdir -p "${pack_dir}"
          # Snapshot of the consumer's package source, excluding VCS/build
          # metadata that has no business in the tarball. `.hashira` is the
          # D14 library self-checkout for THIS job, not part of the
          # consumer's package — without this exclude it would ship inside
          # the published npm tarball for any consumer lacking a tight
          # `package.json` `files` allowlist (pass-1 review, Major #2).
          rsync -a --exclude='.git' --exclude='.hashira' --exclude="${pack_dir}" ./ "${pack_dir}/"
          (
            cd "${pack_dir}"
            npm pkg set version="${RESOLVED_VERSION}"
            mkdir -p "${RUNNER_TEMP}/hashira-pack-output"
            npm pack --pack-destination "${RUNNER_TEMP}/hashira-pack-output"
          )
          echo "npm-package-ci: packed tarball stamped with version ${RESOLVED_VERSION} at ${RUNNER_TEMP}/hashira-pack-output" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload packed tarball (same-run CI->CD artifact handoff)
        # actions/upload-artifact v4.4.3 — same pin already verified and in
        # use at .github/actions/coverage-report/action.yml; reused here
        # rather than introducing a new pin to the verified-pin set.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Stable, documented name: Phase 3's CD job downloads this exact
          # name to publish "the same-run artifact" (sdd.md §8's open item;
          # this iteration is where the in-run upload-artifact /
          # download-artifact mechanism is chosen concretely — architecture
          # reviewer Major fix, pass 1). Re-packing in the CD job instead of
          # downloading this artifact is explicitly forbidden by
          # phases/03-cd-composite-normalization.md — it would silently
          # break the byte-identical guarantee NFR-Rel-1 requires.
          name: npm-tarball
          path: ${{ runner.temp }}/hashira-pack-output/*.tgz
          if-no-files-found: error
          # A few days, not the default 90: this artifact only needs to
          # outlive the gap between "CI cuts a release" and "a maintainer
          # triggers/approves the CD publish job," which FR-8 requires to be
          # possible without re-running CI. 5 days covers a maintainer being
          # away for a weekend without keeping stale release tarballs around
          # indefinitely (GitHub's per-artifact storage cost is real, if
          # small, at scale across many releases).
          retention-days: 5
      - name: Assert stamp did not touch the checked-out working tree
        shell: bash
        run: |
          set -euo pipefail
          # D1's stamp-only / no-commit-back invariant: the previous step
          # wrote only inside $RUNNER_TEMP (outside $GITHUB_WORKSPACE). This
          # assertion proves it rather than just asserting it by convention.
          #
          # `--untracked-files=no` is deliberate (pass-1 review, Blocker):
          # the D14 library self-checkout above lands `.hashira/` as
          # UNTRACKED content in $GITHUB_WORKSPACE, and nothing gitignores
          # it. Bare `git status --porcelain` reports untracked files too,
          # so without this flag the assertion fired on every real release,
          # not just one where the working tree was actually modified. The
          # iteration's own acceptance criterion is "no TRACKED-file diff
          # outside the artifact output path" (phases/02-version-resolver.md)
          # — scoping to tracked content is what D1 actually requires; it
          # still catches any modification to a tracked file (the real
          # invariant), it just stops flagging the expected, harmless
          # `.hashira/` self-checkout dir as a violation.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::npm-package-ci: working tree changed during version/pack steps — stamp must only touch the packed output, never the checked-out tree" >&2
            git status --porcelain --untracked-files=no >&2
            exit 1
          fi
          echo "npm-package-ci: git status (tracked files) clean after stamp — no commit-back occurred" >> "${GITHUB_STEP_SUMMARY}"

  lint:
    name: lint
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # actions/checkout v4.2.2 — consumer's tree, full history so commitlint
      # can walk the PR range across merge commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node_version }}
      - name: Run commitlint over PR range (non-blocking)
        id: commitlint
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # NOTE: explicit `+e` here, not just omitting `-e` from this line.
          # GitHub's default `shell: bash` step is invoked as
          # `bash --noprofile --norc -e -o pipefail {0}` — `-e` is ALREADY
          # active before this script's first line ever runs. Writing only
          # `set -uo pipefail` (no `+e`) does NOT turn it back off; that was
          # a real bug here (hashira-v2 iteration 6.5, found via rogue's live
          # migration — the first real `workflow_call` invocation of this
          # workflow ever exercised this step against real commits, which
          # immediately tripped it). The step is non-blocking by D11; we want
          # commitlint's non-zero exit code to be CAPTURED (status=$?) rather
          # than abort the script — hence the explicit `+e`.
          set -uo pipefail +e
          # Install commitlint + config-conventional to a FIXED prefix
          # directory, and write the config file into that SAME directory
          # (hashira-v2 iteration 6.5 follow-up fix, found via somi's live
          # PR — the first real PR range with a non-Conventional-Commit
          # message anyone actually opened against a real consumer after the
          # `-e` fix above shipped). The previous approach
          # (`npx --yes -p ... -- commitlint --config <(printf ...)`) had
          # two compounding bugs:
          #   1. `--config <(...)` is a process-substitution path
          #      (`/dev/fd/N`) with no file extension. cosmiconfig (commitlint's
          #      config loader) picks a parser by extension; with none, it
          #      fell back to YAML, which then choked on the literal
          #      `module.exports = {...}` JS syntax — every PR range hit
          #      this, not just ones with real non-CC commits, and the
          #      resulting stack trace landed in the sticky PR comment
          #      mislabeled as "non-CC commits found".
          #   2. Even with a correctly-recognized `.cjs` config, commitlint's
          #      `extends: ['@commitlint/config-conventional']` resolves
          #      that package name relative to the CONFIG FILE's directory
          #      (Node module resolution) — not relative to npx's own
          #      (ephemeral, unlabeled) install cache. A bare npx invocation
          #      has no directory where both the config and the resolved
          #      package coexist.
          # Installing both packages into one fixed, named directory and
          # writing the config there too gives Node's resolution a real
          # `node_modules/@commitlint/config-conventional` to find,
          # sibling to the config file — exactly the shape `extends:`
          # expects. npm has no SHA-pin equivalent; see the npm supply-chain
          # trust model paragraph in `.github/actions/npm-release/action.yml`.
          install_dir="${RUNNER_TEMP}/commitlint-install"
          rm -rf "${install_dir}"
          mkdir -p "${install_dir}"
          npm install --no-save --silent --prefix "${install_dir}" \
            @commitlint/cli@19.5.0 @commitlint/config-conventional@19.5.0
          printf "module.exports = { extends: ['@commitlint/config-conventional'] };\n" \
            > "${install_dir}/commitlint.config.cjs"
          # Capture stdout and stderr SEPARATELY, not merged. commitlint's
          # actual findings (the `✖ found N problems` summary) are written
          # entirely to stdout; any install/runtime crash (an uncaught JS
          # exception, `throw err`) is written to stderr. Merging them (the
          # previous `2>&1`) is what let a stderr-only crash trace get
          # treated as if it were a stdout findings report.
          report="${RUNNER_TEMP}/commitlint-report.txt"
          err="${RUNNER_TEMP}/commitlint-stderr.txt"
          "${install_dir}/node_modules/.bin/commitlint" \
            --config "${install_dir}/commitlint.config.cjs" \
            --from "${BASE_SHA}" --to "${HEAD_SHA}" \
            > "${report}" 2> "${err}"
          status=$?
          # Inconclusive ("install failure or runtime crash", not a real
          # commitlint finding — iter-2.2 review Major #1): non-zero status
          # AND no real findings on stdout. A crash's stack trace lands on
          # stderr, never stdout, so an empty stdout report is the correct
          # signal regardless of what (if anything) stderr captured.
          inconclusive="false"
          if [ "${status}" -ne 0 ] && [ ! -s "${report}" ]; then
            inconclusive="true"
          fi
          {
            echo "report_path=${report}"
            echo "status=${status}"
            echo "inconclusive=${inconclusive}"
          } >> "${GITHUB_OUTPUT}"
          if [ "${status}" -eq 0 ]; then
            echo "commitlint: clean (no non-CC commits in range)" >> "${GITHUB_STEP_SUMMARY}"
          elif [ "${inconclusive}" = "true" ]; then
            {
              echo "commitlint: produced no findings on stdout; treating as inconclusive (likely install/runtime failure). Step is non-blocking; sticky comment skipped.";
              if [ -s "${err}" ]; then
                echo '```';
                cat "${err}";
                echo '```';
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "commitlint: non-CC commits found in range (non-blocking warning)";
              echo '```';
              cat "${report}";
              echo '```';
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          # D11: non-blocking. Always exit 0.
          exit 0
      - name: Post sticky commitlint comment
        # Skip the sticky comment on inconclusive runs to avoid a misleading
        # "non-CC commits found" comment when the real cause was an install
        # failure (iter-2.2 review Major #1).
        if: ${{ github.event_name == 'pull_request' && steps.commitlint.outputs.status != '0' && steps.commitlint.outputs.inconclusive != 'true' }}
        # actions/github-script v7.0.1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REPORT_FILE: ${{ steps.commitlint.outputs.report_path }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- hashira:npm-package-ci:commitlint -->';
            const report = fs.readFileSync(process.env.REPORT_FILE, 'utf8');
            const body = `${marker}\n### commitlint findings (non-blocking)\n\nOne or more commits in this PR's range don't follow [Conventional Commits](https://www.conventionalcommits.org/). semantic-release will not infer a version bump from them. The PR is **not** blocked — fix-forward or squash-rewrite at merge.\n\n\`\`\`\n${report}\n\`\`\`\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (!issue_number) {
              core.info('npm-package-ci/commitlint: no PR number; skipping sticky comment.');
              return;
            }
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const prior = existing.find(c => c.body && c.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
              core.info(`npm-package-ci/commitlint: updated sticky comment ${prior.id}.`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('npm-package-ci/commitlint: created sticky comment.');
            }

  test:
    name: test
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # coverage-report (run as the last step of this job) posts a sticky PR
      # comment via actions/github-script on pull_request events.
      pull-requests: write
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node_version }}
      # Library self-checkout per D14: ./.hashira/ holds hashira at library_ref.
      - name: Checkout hashira library (D14)
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ inputs.library_ref }}
          path: .hashira
          persist-credentials: false
      # Same bug as static-webapp-ci.yml's test/build-and-upload jobs — this
      # job ran `test_command` against an empty node_modules with nothing
      # ever installing the consumer's devDependencies (found via the same
      # live-consumer PR that surfaced the static-webapp-ci.yml half).
      - name: Install dependencies
        shell: bash
        run: npm ci
      - name: Run tests
        uses: ./.hashira/.github/actions/run-tests-js
        with:
          command: ${{ inputs.test_command }}
          coverage_path: ${{ inputs.coverage_path }}
      # Report coverage IN THIS JOB: run-tests-js just standardized the
      # coverage file at `coverage_path` in this workspace, so it is present
      # here. (A separate coverage-report job ran on a fresh runner with no
      # artifact handoff and always failed "file not found" — same class of
      # bug as nuget-package-ci.yml's, found and fixed via somi's iteration
      # 6.1/6.2 live migration. Removed entirely rather than wired up with
      # an artifact handoff, mirroring that fix.)
      - name: Report coverage
        uses: ./.hashira/.github/actions/coverage-report
        with:
          coverage_path: ${{ inputs.coverage_path }}

  scan-suite:
    name: scan-suite
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeQL needs security-events:write when enabled; granted here even
      # when codeql is in the default skip list so consumers who enable it
      # via scan_disable: '' don't hit a permissions error.
      security-events: write
      # dependency-review on PR events reads PR metadata.
      pull-requests: read
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v4.1.0 — visibility-detect shim runs via `node`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node_version }}
      # Library self-checkout per D14.
      - name: Checkout hashira library (D14)
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ inputs.library_ref }}
          path: .hashira
          persist-credentials: false
      - name: Run scan-suite
        uses: ./.hashira/.github/actions/scan-suite
        with:
          scan_disable: ${{ inputs.scan_disable }}
