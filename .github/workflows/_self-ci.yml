  consumer-integration:
    name: consumer-integration (${{ matrix.flow }})
    # Proves each flow works for a real consumer: for this commit S it pushes
    # branch hashira/<S> to the flow's fixture repo with every skathio/hashira
    # ref set to S, opens a PR there and waits for that PR's CI, then runs the
    # release path on the same branch and checks the tag and Release (npm,
    # NuGet) or the live Pages site (static, checked by the fixture's own
    # deploy job). The npm fixture also gets hashira/<S>-gate, whose PR run
    # must fail at the quality-gate job and nowhere earlier. The fixture
    # sources are tests/consumers/<flow>/, reviewed here.
    #
    # It authenticates with a GitHub App installed only on the three fixture
    # repos (secrets FIXTURE_APP_ID and FIXTURE_APP_PRIVATE_KEY). The App
    # needs Contents, Pull requests, Actions and Workflows write on them. The
    # same two secrets are also stored as Dependabot secrets, because a
    # Dependabot PR (the weekly pin bump) gets only those and must pass too.
    # On a PR from a fork those secrets are absent and this job fails: accepted.
    runs-on: ubuntu-latest
    # The sum of the step limits below, so a slow step fails with its own
    # message and the always() cleanup still runs: lock wait 125, lock take
    # 45, open 15, three fixture waits of 35 (each gives up after 30 minutes
    # on its own, tests/consumer-integration/lib/plan.js), cleanup 20.
    timeout-minutes: 315
    # Runs against one fixture repo never overlap: they share its tags,
    # Releases and Pages site. That is a lock branch in the fixture repo
    # (tests/consumer-integration/lib/lock.js), not a concurrency group: a
    # group keeps one pending job and cancels the older one when a third run
    # queues, which would leave that PR red.
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: npm
            repo: hashira-fixture-npm
            source: tests/consumers/npm
          - flow: nuget
            repo: hashira-fixture-nuget
            source: tests/consumers/nuget
          - flow: static
            repo: hashira-fixture-static
            source: tests/consumers/static-webapp
    permissions:
      # Read the fixture sources from this repo. Everything done in the
      # fixture repos uses the App token, not this job's GITHUB_TOKEN.
      contents: read
      # Read whether the hashira run holding a fixture repo's lock is still
      # going, to tell a live lock from one a dead job left behind.
      actions: read
    env:
      FIXTURE_FLOW: ${{ matrix.flow }}
      FIXTURE_REPO: ${{ matrix.repo }}
      FIXTURE_SOURCE: ${{ matrix.source }}
      # The PR's head commit, not the merge commit: the fixture pins
      # skathio/hashira at S, so S must be a commit on a hashira branch.
      HASHIRA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Only lock.js reads hashira's runs with it; fixture calls never see it.
      HASHIRA_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      # Waits for another run's lock anonymously (the fixture repos are
      # public), so no App token has to outlive a long wait.
      - name: Wait for the fixture repo's integration lock
        timeout-minutes: 125
        shell: bash
        run: node tests/consumer-integration/lib/integrate.js lock-wait
      # actions/create-github-app-token v3.3.0. App tokens last an hour, so
      # each phase mints its own; each is scoped to this leg's fixture repo.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: lock-token
        with:
          app-id: ${{ secrets.FIXTURE_APP_ID }}
          private-key: ${{ secrets.FIXTURE_APP_PRIVATE_KEY }}
          owner: skathio
          repositories: ${{ matrix.repo }}
          permission-contents: write
      - name: Take the fixture repo's integration lock
        timeout-minutes: 45
        shell: bash
        env:
          GH_TOKEN: ${{ steps.lock-token.outputs.token }}
        run: node tests/consumer-integration/lib/integrate.js lock
      # actions/create-github-app-token v3.3.0
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app-token
        with:
          app-id: ${{ secrets.FIXTURE_APP_ID }}
          private-key: ${{ secrets.FIXTURE_APP_PRIVATE_KEY }}
          owner: skathio
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
          permission-workflows: write
      - name: Push hashira/<S> to the fixture repo and open its PR
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node tests/consumer-integration/lib/integrate.js open
      - name: Wait for the fixture PR run
        timeout-minutes: 35
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node tests/consumer-integration/lib/integrate.js pr-run
      # actions/create-github-app-token v3.3.0. A fresh token: the PR wait
      # above may have used most of the last one's hour.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: gate-token
        if: matrix.flow == 'npm'
        with:
          app-id: ${{ secrets.FIXTURE_APP_ID }}
          private-key: ${{ secrets.FIXTURE_APP_PRIVATE_KEY }}
          owner: skathio
          repositories: ${{ matrix.repo }}
          permission-actions: read
      - name: Check the quality gate negative case failed at the gate
        if: matrix.flow == 'npm'
        timeout-minutes: 35
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gate-token.outputs.token }}
        run: node tests/consumer-integration/lib/integrate.js gate-run
      # actions/create-github-app-token v3.3.0
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: release-token
        with:
          app-id: ${{ secrets.FIXTURE_APP_ID }}
          private-key: ${{ secrets.FIXTURE_APP_PRIVATE_KEY }}
          owner: skathio
          repositories: ${{ matrix.repo }}
          permission-contents: read
          permission-actions: write
      - name: Run the fixture release path
        timeout-minutes: 35
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: node tests/consumer-integration/lib/integrate.js release
      # actions/create-github-app-token v3.3.0. Cleanup runs on success,
      # failure and cancellation, with a fresh token.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: cleanup-token
        if: always()
        with:
          app-id: ${{ secrets.FIXTURE_APP_ID }}
          private-key: ${{ secrets.FIXTURE_APP_PRIVATE_KEY }}
          owner: skathio
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
      - name: Clean up the fixture repo
        if: always()
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ steps.cleanup-token.outputs.token }}
        run: node tests/consumer-integration/lib/integrate.js cleanup
