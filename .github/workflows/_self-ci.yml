# Library self-CI (dogfooding). Runs on every PR + push to main.
# Iteration 1.1 scope: scaffold-only — actionlint over our own YAML + a smoke
# job. Future iterations (1.2 / 1.3) extend this with action-smoke + scan-suite
# self-application. No cross-repo `gh workflow run` triggers — fixture repos
# are out of scope per the 2026-05-24 plan-change.
name: _self-ci

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default for the whole workflow; jobs may narrow further.
permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # Pin actionlint by downloading the release binary at a fixed version +
      # verifying the SHA-256 of the archive. Chosen over `rhysd/actionlint@<sha>`
      # so the toolchain has one fewer Marketplace-action pin to refresh; the
      # binary's checksum is the integrity anchor.
      - name: Install actionlint (pinned v1.7.7)
        run: |
          set -euo pipefail
          version="1.7.7"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          # SHA-256 published on the v1.7.7 release page.
          expected_sha="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          curl -fsSL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${expected_sha}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: Run actionlint over workflows + composite actions
        run: |
          set -euo pipefail
          # actionlint by default scans .github/workflows/. Composite actions
          # under .github/actions/<name>/action.yml are validated implicitly
          # when referenced by a workflow; this iteration has none yet, so the
          # plain invocation is sufficient.
          actionlint -color

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: List composite-action directories (scaffold smoke)
        run: |
          set -euo pipefail
          if [ -d .github/actions ]; then
            echo "contents of .github/actions/:"
            ls -la .github/actions/ || true
          else
            echo ".github/actions/ does not exist yet"
          fi
      - name: Write summary
        run: |
          echo "library self-CI: scaffold-only (iteration 1.1)" >> "$GITHUB_STEP_SUMMARY"

  parser-unit-tests:
    name: parser-unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # actions/setup-node v4.1.0 — needed only for a recent enough node
      # to have `node --test` (>= 18). Default ubuntu-latest node would
      # also work but pinning makes the matrix explicit.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Run coverage parser unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/coverage-report/parse-coverage.test.js

  actions-smoke:
    name: actions-smoke
    runs-on: ubuntu-latest
    # PR comment write needed so coverage-report's sticky-comment branch
    # can be exercised on PR events; contents:read for checkout.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false

      # actions/setup-node v4.1.0 — coverage-report depends on a `node`
      # binary on PATH for its parser shim. Run setup-node BEFORE invoking
      # coverage-report so the dependency is explicit in the self-CI shape
      # (rather than relying on the preinstalled ubuntu-latest Node).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      # --- coverage-report smoke against the three fixture files --------
      - name: coverage-report — lcov fixture
        uses: ./.hashira/.github/actions/coverage-report
        with:
          coverage_path: tests/fixtures/coverage-samples/lcov.info
          artifact_name: coverage-smoke-lcov
      - name: coverage-report — cobertura fixture
        uses: ./.hashira/.github/actions/coverage-report
        with:
          coverage_path: tests/fixtures/coverage-samples/cobertura.xml
          artifact_name: coverage-smoke-cobertura
      - name: coverage-report — opencover fixture
        uses: ./.hashira/.github/actions/coverage-report
        with:
          coverage_path: tests/fixtures/coverage-samples/opencover.xml
          artifact_name: coverage-smoke-opencover
      - name: Assert coverage-report summaries are present
        shell: bash
        run: |
          set -euo pipefail
          # The action writes a "coverage-report: lines X% / branches Y%" line
          # per invocation; we expect three of them and all three fixtures are
          # rigged to report lines=80.0% (lcov 8/10; cobertura line-rate=0.8;
          # opencover 8/10 sequence points).
          grep -F 'coverage-report: lines 80.0%' "${RUNNER_TEMP}/hashira-coverage-report.txt"
          count="$(grep -cF 'coverage-report: lines' "${RUNNER_TEMP}/hashira-coverage-report.txt")"
          if [ "${count}" -lt 3 ]; then
            echo "expected >=3 coverage-report summary lines, got ${count}" >&2
            exit 1
          fi

      # --- run-tests-js smoke against the JS fixture --------------------
      # Node already on PATH from the setup-node step above (run before
      # coverage-report). No re-setup needed for run-tests-js.
      - name: run-tests-js — fixture project
        id: js
        uses: ./.hashira/.github/actions/run-tests-js
        with:
          working_directory: tests/run-tests-js
          # Use plain `npm test` against the fixture's package.json. The
          # fixture has no real deps so we skip `npm ci`.
          command: 'npm test'
          coverage_path: 'coverage/lcov.info'
      - name: Assert run-tests-js produced coverage
        shell: bash
        run: |
          set -euo pipefail
          out="${{ steps.js.outputs.coverage_path }}"
          test -f "${out}" || { echo "run-tests-js: expected coverage at ${out}"; exit 1; }

      # --- run-tests-dotnet smoke against the .NET fixture --------------
      # actions/setup-dotnet v4.1.0 — ubuntu-latest images ship SDKs but
      # pinning the action ensures a deterministic 8.x version for the
      # fixture's <TargetFramework>net8.0</TargetFramework>.
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: '8.0.x'
      - name: run-tests-dotnet — fixture project
        id: dotnet
        uses: ./.hashira/.github/actions/run-tests-dotnet
        with:
          working_directory: tests/run-tests-dotnet
          command: 'dotnet test --collect:"XPlat Code Coverage" --results-directory TestResults'
          coverage_path: 'coverage/cobertura.xml'
          results_directory: 'TestResults'
      - name: Assert run-tests-dotnet produced coverage
        shell: bash
        run: |
          set -euo pipefail
          out="${{ steps.dotnet.outputs.coverage_path }}"
          test -f "${out}" || { echo "run-tests-dotnet: expected coverage at ${out}"; exit 1; }

  visibility-detect-unit-tests:
    name: visibility-detect-unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Run visibility-detect unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/scan-suite/visibility-detect.test.js

  scan-suite-default:
    name: scan-suite-default
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeQL needs security-events:write when it runs; we keep it on the
      # job even though codeql is in the default skip list so the override
      # job below can reuse the same shape.
      security-events: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      # actions/setup-node v4.1.0 (for visibility-detect shim invocations).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Run scan-suite with default scan_disable
        id: ss
        uses: ./.hashira/.github/actions/scan-suite
      - name: Assert default summary shape
        shell: bash
        env:
          SUMMARY: ${{ steps.ss.outputs.summary }}
        run: |
          set -euo pipefail
          echo "${SUMMARY}"
          # codeql + actionlint must be consumer-disabled skips.
          echo "${SUMMARY}" | grep -P '^codeql\tskipped\tconsumer disabled$'
          echo "${SUMMARY}" | grep -P '^actionlint\tskipped\tconsumer disabled$'
          # osv must have run.
          echo "${SUMMARY}" | grep -P '^osv\tran\t'
          # gitleaks must have run.
          echo "${SUMMARY}" | grep -P '^gitleaks\tran\t'
          # dependency-review will be skipped (not a PR event) on push.
          echo "${SUMMARY}" | grep -P '^dependency-review\t(ran|skipped)\t'

  scan-suite-override:
    name: scan-suite-override
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Run scan-suite with gitleaks also disabled
        id: ss
        uses: ./.hashira/.github/actions/scan-suite
        with:
          scan_disable: 'codeql,actionlint,gitleaks'
      - name: Assert gitleaks is skipped (consumer disabled)
        shell: bash
        env:
          SUMMARY: ${{ steps.ss.outputs.summary }}
        run: |
          set -euo pipefail
          echo "${SUMMARY}"
          echo "${SUMMARY}" | grep -P '^gitleaks\tskipped\tconsumer disabled$'

  npm-release-shape-validation:
    name: npm-release-shape-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Run npm-release action shape-validation shim
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("pyyaml " + yaml.__version__)'
          python3 tests/npm-release/shape-validate.py

  npm-release-dry-run:
    name: npm-release-dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Skip the actual `npm publish` and tag/release steps. Documented
      # reserved env name; do NOT set in consumer workflows — doing so
      # silently turns publishes into no-ops. NOTE: this does NOT skip the
      # actions/download-artifact / tarball-locate steps (see action.yml) —
      # those run for real below, proving the actual CI->CD artifact-handoff
      # plumbing (NFR-Rel-1), not just the auth-mode branching.
      HASHIRA_NPM_RELEASE_DRY_RUN: '1'
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # D14 self-checkout: composite actions are referenced from .hashira/.
      - name: Checkout library into .hashira
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Pack the dry-run fixture into a real .tgz
        shell: bash
        run: |
          set -euo pipefail
          # Mirrors npm-package-ci.yml's `version` job: pack the fixture
          # directory into a real tarball. There is no version-stamping here
          # (this fixture isn't exercising D1/D8's stamp step — that's
          # npm-package-ci's own shape-validation job) — just producing a
          # real .tgz for the composite's download-artifact step to fetch.
          mkdir -p "${RUNNER_TEMP}/npm-release-dry-run-pack-output"
          npm pack --pack-destination "${RUNNER_TEMP}/npm-release-dry-run-pack-output" \
            ./tests/npm-release/dry-run-fixture
      - name: Upload fixture tarball as 'npm-tarball' (same artifact name the real CI version job uses)
        # actions/upload-artifact v4.4.3 — same pin already verified and in
        # use at npm-package-ci.yml / nuget-package-ci.yml / coverage-report.
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm-release-dry-run-pack-output/*.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Run npm-release against the dry-run fixture (auth=auto)
        id: nr
        uses: ./.hashira/.github/actions/npm-release
        with:
          version: '0.0.0-dryrun'
      - name: Assert dry-run produced a sensible summary
        shell: bash
        env:
          RELEASED: ${{ steps.nr.outputs.released }}
          VERSION: ${{ steps.nr.outputs.version }}
        run: |
          set -euo pipefail
          echo "released='${RELEASED}'  version='${VERSION}'"
          # released must always be false in dry-run mode (HASHIRA_NPM_RELEASE_DRY_RUN=1
          # short-circuits the publish step unconditionally before any network call).
          if [ "${RELEASED}" != "false" ]; then
            echo "expected released=false in dry-run, got '${RELEASED}'" >&2
            exit 1
          fi

  npm-release-dry-run-auth-modes:
    name: npm-release-dry-run-auth-modes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HASHIRA_NPM_RELEASE_DRY_RUN: '1'
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # D14 self-checkout: composite actions are referenced from .hashira/.
      - name: Checkout library into .hashira
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Pack the dry-run fixture into a real .tgz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/npm-release-dry-run-pack-output"
          npm pack --pack-destination "${RUNNER_TEMP}/npm-release-dry-run-pack-output" \
            ./tests/npm-release/dry-run-fixture
      - name: Upload fixture tarball as 'npm-tarball'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm-release-dry-run-pack-output/*.tgz
          if-no-files-found: error
          retention-days: 1
      # Exercises every `auth` value's branching up to (but never past) the
      # point of the real network call — the dry-run flag short-circuits
      # before any of these would actually touch a credential or the
      # registry, so this single job can prove all three values are accepted
      # and wired through safely.
      - name: npm-release — auth=auto (default), dry-run
        uses: ./.hashira/.github/actions/npm-release
        with:
          version: '0.0.0-dryrun'
      - name: npm-release — auth=token, dry-run
        uses: ./.hashira/.github/actions/npm-release
        with:
          version: '0.0.0-dryrun'
          auth: token
          npm_token: fake-smoke-token
      - name: npm-release — auth=oidc, dry-run (no real OIDC attempted under dry-run)
        uses: ./.hashira/.github/actions/npm-release
        with:
          version: '0.0.0-dryrun'
          auth: oidc
      - name: Assert dry-run summary line is present
        shell: bash
        run: |
          set -euo pipefail
          echo "npm-release-dry-run-auth-modes: all 3 action invocations passed (dry-run path exercised by HASHIRA_NPM_RELEASE_DRY_RUN=1 for auth=auto/token/oidc)"

  npm-release-smoke-oidc-fails-loud:
    name: npm-release-smoke-oidc-fails-loud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Deliberately NOT granting id-token: write — this job proves auth=oidc
      # fails loud when no OIDC token is reachable, which requires the
      # GitHub-provided ACTIONS_ID_TOKEN_REQUEST_* vars to be genuinely absent,
      # not merely unused.
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # D14 self-checkout: composite actions are referenced from .hashira/.
      - name: Checkout library into .hashira
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Pack a real (unique-named) tarball — never actually reaches the registry
        shell: bash
        run: |
          set -euo pipefail
          # A unique, obviously-fake package name: even in the hypothetical
          # case this attempt's fail-loud guarantee were broken by a future
          # regression, there is no real package by this name to collide
          # with. Belt-and-suspenders on top of the fail-loud assertion below,
          # not a substitute for it. Written via `node -e` rather than a
          # heredoc — a YAML block-indented heredoc terminator is NOT at
          # column 0, so bash would never match it and silently swallow the
          # rest of the script into the heredoc body (confirmed by direct
          # reproduction during this iteration's implementation).
          mkdir -p "${RUNNER_TEMP}/npm-release-oidc-test-pkg"
          node -e '
            const fs = require("fs");
            const pkg = {
              name: "hashira-npm-release-oidc-fails-loud-test-zzz-never-published",
              version: "0.0.0-oidctest",
              license: "MIT",
            };
            fs.writeFileSync(
              process.env.RUNNER_TEMP + "/npm-release-oidc-test-pkg/package.json",
              JSON.stringify(pkg, null, 2),
            );
          '
          mkdir -p "${RUNNER_TEMP}/npm-release-oidc-test-pack-output"
          npm pack --pack-destination "${RUNNER_TEMP}/npm-release-oidc-test-pack-output" \
            "${RUNNER_TEMP}/npm-release-oidc-test-pkg"
      - name: Upload fixture tarball as 'npm-tarball'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm-release-oidc-test-pack-output/*.tgz
          if-no-files-found: error
          retention-days: 1
      # Pass-2 regression lock (Blocker/Major): poison the cwd with a
      # project `.npmrc` (fake token A) and an `npm_config_*` env var (fake
      # token B) — the two leak paths fixed via clean-cwd + scrub +
      # globalconfig. A regression would auth with one of these and fail
      # E401, not ENEEDAUTH — distinguished by the marker assertion below.
      - name: Poison the working directory + environment with fake credentials (regression fixture)
        shell: bash
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=poisoned-token-from-project-npmrc-must-never-be-used" > .npmrc
          echo "npm-release-smoke-oidc-fails-loud: wrote a poisoned .npmrc to $(pwd)/.npmrc"
      # NOT run under HASHIRA_NPM_RELEASE_DRY_RUN — proves fail-loud for
      # real (see action header's '## Authentication model'). The poisoned
      # fixtures above/below must NOT change this outcome.
      - name: npm-release — auth=oidc with no id-token grant MUST fail loud (negative test)
        id: oidc_attempt
        continue-on-error: true
        uses: ./.hashira/.github/actions/npm-release
        with:
          version: '0.0.0-oidctest'
          auth: oidc
          npm_token: fake-token-that-must-not-be-used
        env:
          # Second leak path (env-var-to-config mapping) — a DIFFERENT fake
          # token, so a fix that only closed one of the two paths would
          # still be caught.
          npm_config_//registry.npmjs.org/:_authToken: poisoned-token-from-npm-config-envvar-must-never-be-used
      - name: Assert the auth=oidc step failed for the SPECIFIC reason (not just any failure)
        shell: bash
        env:
          OIDC_OUTCOME: ${{ steps.oidc_attempt.outcome }}
        run: |
          set -euo pipefail
          if [ "${OIDC_OUTCOME}" = "success" ]; then
            echo "::error::npm-release-smoke-oidc-fails-loud: auth=oidc step unexpectedly SUCCEEDED with no id-token grant — it must fail loud, not silently fall back to npm_token (D3/D11)." >&2
            exit 1
          fi
          # Assert the SPECIFIC ENEEDAUTH reason via the diagnostic marker
          # (same pattern as nuget-push) — also the regression lock for the
          # pass-1 leak: a regressed fix would auth with a poisoned token
          # and fail E401, not ENEEDAUTH.
          marker_file="${RUNNER_TEMP}/npm-release-failure-reason.txt"
          if [ ! -f "${marker_file}" ] || [ "$(cat "${marker_file}")" != "eneedauth" ]; then
            echo "::error::npm-release-smoke-oidc-fails-loud: auth=oidc step failed, but NOT for the expected 'eneedauth' reason (marker file missing or mismatched: $(cat "${marker_file}" 2>/dev/null || echo '<absent>')). This test must fail for the OIDC-no-credential path specifically — including the possibility that the poisoned .npmrc/npm_config_* fixtures above actually leaked a credential (which would surface as E401, not ENEEDAUTH)." >&2
            exit 1
          fi
          echo "npm-release-smoke-oidc-fails-loud: auth=oidc correctly failed loud (npm's own ENEEDAUTH) instead of authenticating with the supplied npm_token OR either poisoned fixture credential (project .npmrc / npm_config_* env var)."
          echo ""
          echo "Honest limitation (documented, not silently assumed covered): this proves auth=oidc fails loud when NO credential is reachable at all, INCLUDING when a consumer-side project .npmrc or npm_config_* env var is present (the pass-1 leak paths). It does NOT exercise a genuine ref/job-workflow-mismatch OIDC failure against a real configured npm trusted-publishing policy — deferred to Phase 6's live consumer validation, same category as A2/A3."

  npm-package-ci-shape-validation:
    name: npm-package-ci-shape-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Verify python3 + pyyaml availability
        shell: bash
        run: |
          set -euo pipefail
