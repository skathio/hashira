  nuget-push-smoke:
    name: nuget-push-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Force the action into dry-run; no real push attempt (and no tag/release
      # attempt either — both are skipped under dry-run), no need for a real
      # .nupkg on disk. Documented reserved env name; do NOT set in consumer
      # workflows. Dry-run short-circuits inside each `run:` step (push, and
      # tag/release via its `if:`) AFTER the auth-mode validation/branching
      # logic already ran, so this single job can exercise the auth-mode
      # branching for every `auth` value safely, with no real OIDC/network call.
      HASHIRA_NUGET_PUSH_DRY_RUN: '1'
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      - name: nuget-push — auth=auto (default), dry-run against a fake path
        uses: ./.hashira/.github/actions/nuget-push
        with:
          # Path does not need to exist in dry-run mode; the action exits
          # before touching the filesystem.
          nupkg_path: ./packages/Fake.0.0.0.nupkg
          version: '0.0.0-smoke'
      - name: nuget-push — auth=token, dry-run
        uses: ./.hashira/.github/actions/nuget-push
        with:
          nupkg_path: ./packages/Fake.0.0.0.nupkg
          version: '0.0.0-smoke'
          auth: token
          api_key: fake-smoke-key
      - name: nuget-push — auth=oidc, dry-run (no real OIDC attempted under dry-run)
        uses: ./.hashira/.github/actions/nuget-push
        with:
          nupkg_path: ./packages/Fake.0.0.0.nupkg
          version: '0.0.0-smoke'
          auth: oidc
          nuget_user: fake-smoke-user
      - name: Assert dry-run summary line is present
        shell: bash
        run: |
          set -euo pipefail
          echo "nuget-push-smoke: all 3 action invocations passed (dry-run path exercised by HASHIRA_NUGET_PUSH_DRY_RUN=1 for auth=auto/token/oidc)"

  nuget-push-smoke-oidc-fails-loud:
    name: nuget-push-smoke-oidc-fails-loud
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      # Not run under HASHIRA_NUGET_PUSH_DRY_RUN: this job deliberately proves
      # auth=oidc's fail-loud behavior outside dry-run, since the OIDC-attempt
      # branch (and its failure path) is exactly what dry-run mode skips
      # (NuGet/login never runs there). No `id-token: write` is granted here,
      # so NuGet/login fails to mint a key — `auth=oidc` MUST fail the job, not
      # silently fall back to api_key (D3/D11's central invariant), even though
      # an api_key IS supplied below.
      - name: nuget-push — auth=oidc with no id-token grant MUST fail loud (negative test)
        id: oidc_attempt
        continue-on-error: true
        uses: ./.hashira/.github/actions/nuget-push
        with:
          nupkg_path: ./packages/Fake.0.0.0.nupkg
          version: '0.0.0-smoke'
          auth: oidc
          nuget_user: fake-smoke-user
          api_key: fake-smoke-key-that-must-not-be-used
      - name: Assert the auth=oidc step failed for the SPECIFIC reason (not just any failure)
        shell: bash
        env:
          OIDC_OUTCOME: ${{ steps.oidc_attempt.outcome }}
        run: |
          set -euo pipefail
          if [ "${OIDC_OUTCOME}" = "success" ]; then
            echo "::error::nuget-push-smoke-oidc-fails-loud: auth=oidc step unexpectedly SUCCEEDED with no id-token grant — it must fail loud, not silently fall back to api_key (D3/D11)." >&2
            exit 1
          fi
          # Not just "it failed" — assert it failed for the OIDC-key-not-minted
          # reason specifically, via the diagnostic marker nuget-push writes on
          # that exact path (pass-1 review iter 3.2, Minor: a future change adding
          # an earlier-failing check, e.g. version-format validation, could make
          # this test stay green while no longer exercising the OIDC fail-loud
          # branch at all — this assertion closes that regression-test gap).
          marker_file="${RUNNER_TEMP}/nuget-push-failure-reason.txt"
          if [ ! -f "${marker_file}" ] || [ "$(cat "${marker_file}")" != "oidc_no_key" ]; then
            echo "::error::nuget-push-smoke-oidc-fails-loud: auth=oidc step failed, but NOT for the expected 'oidc_no_key' reason (marker file missing or mismatched: $(cat "${marker_file}" 2>/dev/null || echo '<absent>')). This test must fail for the OIDC-key-not-minted path specifically, or it could silently stop covering D3/D11's invariant." >&2
            exit 1
          fi
          echo "nuget-push-smoke-oidc-fails-loud: auth=oidc correctly failed loud for the expected reason (oidc_no_key) instead of falling back to the supplied api_key."

  pages-upload-shape-smoke:
    name: pages-upload-shape-smoke
    runs-on: ubuntu-latest
    # The action documents `id-token: write` + `pages: write` as required
    # by the upstream upload-pages-artifact step; the dry-run hook below
    # skips that step so we don't actually need those scopes for this
    # smoke. Keep the job at `contents: read` only — the smoke proves the
    # autodetect + summary path, NOT the real upload.
    permissions:
      contents: read
    env:
      # Force the action's resolve step to run but skip the third-party
      # upload step. Documented reserved env name; do NOT set in consumer
      # workflows. See iter 4.1 phase brief: the library repo deliberately
      # does NOT enable Pages on itself.
      HASHIRA_PAGES_UPLOAD_DRY_RUN: '1'
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      - name: pages-upload — explicit path against tests/pages-fixture
        id: pu
        uses: ./.hashira/.github/actions/pages-upload
        with:
          path: tests/pages-fixture
      - name: Assert explicit-path outputs + summary line
        shell: bash
        env:
          RESOLVED: ${{ steps.pu.outputs.resolved_path }}
          MODE: ${{ steps.pu.outputs.detection_mode }}
        run: |
          set -euo pipefail
          echo "resolved='${RESOLVED}'  mode='${MODE}'"
          if [ "${RESOLVED}" != "tests/pages-fixture" ]; then
            echo "::error::pages-upload-shape-smoke: resolved_path expected 'tests/pages-fixture', got '${RESOLVED}'" >&2
            exit 1
          fi
          if [ "${MODE}" != "explicit" ]; then
            echo "::error::pages-upload-shape-smoke: detection_mode expected 'explicit', got '${MODE}'" >&2
            exit 1
          fi
          # resolved_path + detection_mode outputs are the canonical assertions;
          # GITHUB_STEP_SUMMARY is not accessible across steps (per-step file).

  pages-upload-autodetect-smoke:
    name: pages-upload-autodetect-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HASHIRA_PAGES_UPLOAD_DRY_RUN: '1'
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      - name: Stage tests/pages-fixture into a dist/ directory at repo root
        shell: bash
        run: |
          set -euo pipefail
          # Autodetect search order is dist/ build/ out/ public/ — first
          # found wins. Copy the fixture into dist/ so autodetect picks it
          # up at the first search step. (Cannot rename the fixture
          # in-place: the explicit-path smoke job runs against
          # tests/pages-fixture.)
          mkdir -p dist
          cp tests/pages-fixture/index.html tests/pages-fixture/styles.css dist/
          ls -la dist/
      - name: pages-upload — no path input; autodetect should find dist/
        id: pu
        uses: ./.hashira/.github/actions/pages-upload
      - name: Assert autodetect resolved to dist/
        shell: bash
        env:
          RESOLVED: ${{ steps.pu.outputs.resolved_path }}
          MODE: ${{ steps.pu.outputs.detection_mode }}
        run: |
          set -euo pipefail
          echo "resolved='${RESOLVED}'  mode='${MODE}'"
          if [ "${RESOLVED}" != "dist" ]; then
            echo "::error::pages-upload-autodetect-smoke: resolved_path expected 'dist', got '${RESOLVED}'" >&2
            exit 1
          fi
          if [ "${MODE}" != "autodetect" ]; then
            echo "::error::pages-upload-autodetect-smoke: detection_mode expected 'autodetect', got '${MODE}'" >&2
            exit 1
          fi
          # resolved_path + detection_mode outputs verified above; GITHUB_STEP_SUMMARY not accessible across steps.
      - name: Clean up staged dist/
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          test ! -d dist && echo "dist removed"

