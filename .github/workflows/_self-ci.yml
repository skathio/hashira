# Library self-CI (dogfooding). Runs on every PR + push to main.
# Iteration 1.1 scope: scaffold-only — actionlint over our own YAML + a smoke
# job. Future iterations (1.2 / 1.3) extend this with action-smoke + scan-suite
# self-application. No cross-repo `gh workflow run` triggers — fixture repos
# are out of scope per the 2026-05-24 plan-change.
name: _self-ci

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default for the whole workflow; jobs may narrow further.
permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # Pin actionlint by downloading the release binary at a fixed version +
      # verifying the SHA-256 of the archive. Chosen over `rhysd/actionlint@<sha>`
      # so the toolchain has one fewer Marketplace-action pin to refresh; the
      # binary's checksum is the integrity anchor.
      - name: Install actionlint (pinned v1.7.7)
        run: |
          set -euo pipefail
          version="1.7.7"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          # SHA-256 published on the v1.7.7 release page.
          expected_sha="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          curl -fsSL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${expected_sha}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: Run actionlint over workflows + composite actions
        run: |
          set -euo pipefail
          # actionlint by default scans .github/workflows/. Composite actions
          # under .github/actions/<name>/action.yml are validated implicitly
          # when referenced by a workflow; this iteration has none yet, so the
          # plain invocation is sufficient.
          actionlint -color

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: List composite-action directories (scaffold smoke)
        run: |
          set -euo pipefail
          if [ -d .github/actions ]; then
            echo "contents of .github/actions/:"
            ls -la .github/actions/ || true
          else
            echo ".github/actions/ does not exist yet"
          fi
      - name: Write summary
        run: |
          echo "library self-CI: scaffold-only (iteration 1.1)" >> "$GITHUB_STEP_SUMMARY"

  parser-unit-tests:
    name: parser-unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-node v4.1.0 — needed only for a recent enough node
      # to have `node --test` (>= 18). Default ubuntu-latest node would
      # also work but pinning makes the matrix explicit.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Run coverage parser unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/coverage-report/parse-coverage.test.js

  actions-smoke:
    name: actions-smoke
    runs-on: ubuntu-latest
    # PR comment write needed so coverage-report's sticky-comment branch
    # can be exercised on PR events; contents:read for checkout.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false

      # actions/setup-node v4.1.0 — coverage-report depends on a `node`
      # binary on PATH for its parser shim. Run setup-node BEFORE invoking
      # coverage-report so the dependency is explicit in the self-CI shape
      # (rather than relying on the preinstalled ubuntu-latest Node).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      # --- coverage-report smoke against the three fixture files --------
      - name: coverage-report — lcov fixture
        uses: ./.hashira/.github/actions/coverage-report
        with:
          coverage_path: tests/fixtures/coverage-samples/lcov.info
          artifact_name: coverage-smoke-lcov
      - name: coverage-report — cobertura fixture
        uses: ./.hashira/.github/actions/coverage-report
        with:
          coverage_path: tests/fixtures/coverage-samples/cobertura.xml
          artifact_name: coverage-smoke-cobertura
      - name: coverage-report — opencover fixture
        uses: ./.hashira/.github/actions/coverage-report
        with:
          coverage_path: tests/fixtures/coverage-samples/opencover.xml
          artifact_name: coverage-smoke-opencover
      - name: Assert coverage-report summaries are present
        shell: bash
        run: |
          set -euo pipefail
          # The action writes a "coverage-report: lines X% / branches Y%" line
          # per invocation; we expect three of them and all three fixtures are
          # rigged to report lines=80.0% (lcov 8/10; cobertura line-rate=0.8;
          # opencover 8/10 sequence points).
          grep -F 'coverage-report: lines 80.0%' "${RUNNER_TEMP}/hashira-coverage-report.txt"
          count="$(grep -cF 'coverage-report: lines' "${RUNNER_TEMP}/hashira-coverage-report.txt")"
          if [ "${count}" -lt 3 ]; then
            echo "expected >=3 coverage-report summary lines, got ${count}" >&2
            exit 1
          fi

      # --- run-tests-js smoke against the JS fixture --------------------
      # Node already on PATH from the setup-node step above (run before
      # coverage-report). No re-setup needed for run-tests-js.
      - name: run-tests-js — fixture project
        id: js
        uses: ./.hashira/.github/actions/run-tests-js
        with:
          working_directory: tests/run-tests-js
          # Use plain `npm test` against the fixture's package.json. The
          # fixture has no real deps so we skip `npm ci`.
          command: 'npm test'
          coverage_path: 'coverage/lcov.info'
      - name: Assert run-tests-js produced coverage
        shell: bash
        run: |
          set -euo pipefail
          out="${{ steps.js.outputs.coverage_path }}"
          test -f "${out}" || { echo "run-tests-js: expected coverage at ${out}"; exit 1; }

      # --- run-tests-dotnet smoke against the .NET fixture --------------
      # actions/setup-dotnet v4.1.0 — ubuntu-latest images ship SDKs but
      # pinning the action ensures a deterministic 8.x version for the
      # fixture's <TargetFramework>net8.0</TargetFramework>.
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: '8.0.x'
      - name: run-tests-dotnet — fixture project
        id: dotnet
        uses: ./.hashira/.github/actions/run-tests-dotnet
        with:
          working_directory: tests/run-tests-dotnet
          command: 'dotnet test --collect:"XPlat Code Coverage" --results-directory TestResults'
          coverage_path: 'coverage/cobertura.xml'
          results_directory: 'TestResults'
      - name: Assert run-tests-dotnet produced coverage
        shell: bash
        run: |
          set -euo pipefail
          out="${{ steps.dotnet.outputs.coverage_path }}"
          test -f "${out}" || { echo "run-tests-dotnet: expected coverage at ${out}"; exit 1; }

  visibility-detect-unit-tests:
    name: visibility-detect-unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Run visibility-detect unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/scan-suite/visibility-detect.test.js

  scan-suite-default:
    name: scan-suite-default
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeQL needs security-events:write when it runs; we keep it on the
      # job even though codeql is in the default skip list so the override
      # job below can reuse the same shape.
      security-events: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      # actions/setup-node v4.1.0 (for visibility-detect shim invocations).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Run scan-suite with default scan_disable
        id: ss
        uses: ./.hashira/.github/actions/scan-suite
      - name: Assert default summary shape
        shell: bash
        env:
          SUMMARY: ${{ steps.ss.outputs.summary }}
        run: |
          set -euo pipefail
          echo "${SUMMARY}"
          # codeql + actionlint must be consumer-disabled skips.
          echo "${SUMMARY}" | grep -P '^codeql\tskipped\tconsumer disabled$'
          echo "${SUMMARY}" | grep -P '^actionlint\tskipped\tconsumer disabled$'
          # osv must have run.
          echo "${SUMMARY}" | grep -P '^osv\tran\t'
          # gitleaks must have run.
          echo "${SUMMARY}" | grep -P '^gitleaks\tran\t'
          # dependency-review will be skipped (not a PR event) on push.
          echo "${SUMMARY}" | grep -P '^dependency-review\t(ran|skipped)\t'

  scan-suite-override:
    name: scan-suite-override
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Run scan-suite with gitleaks also disabled
        id: ss
        uses: ./.hashira/.github/actions/scan-suite
        with:
          scan_disable: 'codeql,actionlint,gitleaks'
      - name: Assert gitleaks is skipped (consumer disabled)
        shell: bash
        env:
          SUMMARY: ${{ steps.ss.outputs.summary }}
        run: |
          set -euo pipefail
          echo "${SUMMARY}"
          echo "${SUMMARY}" | grep -P '^gitleaks\tskipped\tconsumer disabled$'

  npm-release-unit-tests:
    name: npm-release-unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-node v4.1.0 — Node 24 matches the action's runtime (D7).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Run npm-release build-releaserc unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/npm-release/build-releaserc.test.js
      - name: Run npm-release action shape-validation shim
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("pyyaml " + yaml.__version__)'
          python3 tests/npm-release/shape-validate.py

  npm-release-dry-run:
    name: npm-release-dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: write  # semantic-release --dry-run runs `git push --dry-run` + @semantic-release/github token check
    env:
      # Force the action into --dry-run --no-ci so no publish or git push is
      # attempted. Documented reserved env name; do NOT set in consumer workflows.
      HASHIRA_SEMANTIC_RELEASE_DRY_RUN: '1'
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # D14 self-checkout: composite actions are referenced from .hashira/.
      - name: Checkout library into .hashira
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      - name: Run npm-release against the dry-run fixture
        id: nr
        uses: ./.hashira/.github/actions/npm-release
        with:
          working_directory: tests/npm-release/dry-run-fixture
      - name: Assert dry-run produced a sensible summary
        shell: bash
        env:
          RELEASED: ${{ steps.nr.outputs.released }}
          VERSION: ${{ steps.nr.outputs.version }}
        run: |
          set -euo pipefail
          echo "released='${RELEASED}'  version='${VERSION}'"
          # released must always be false in dry-run mode (HASHIRA_SEMANTIC_RELEASE_DRY_RUN=1
          # forces released=false regardless of the semantic-release log output).
          if [ "${RELEASED}" != "false" ]; then
            echo "expected released=false in dry-run, got '${RELEASED}'" >&2
            exit 1
          fi

  npm-package-ci-shape-validation:
    name: npm-package-ci-shape-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify python3 + pyyaml availability
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("pyyaml " + yaml.__version__)'
      - name: Run shape-validation shim
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/npm-package-ci/shape-validate.py

  scan-suite-codeql-skip-notice:
    name: scan-suite-codeql-skip-notice
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # Force the visibility-detect shim into the private+no-GHAS branch so
      # codeql exercises its skip-with-notice path even on a public/GHAS
      # runner. Matches the documented test override.
      HASHIRA_FORCE_PRIVATE_NO_GHAS: '1'
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Run scan-suite with only actionlint disabled (codeql enabled)
        id: ss
        uses: ./.hashira/.github/actions/scan-suite
        with:
          scan_disable: 'actionlint'
      - name: Assert codeql skip-with-notice text
        shell: bash
        env:
          SUMMARY: ${{ steps.ss.outputs.summary }}
        run: |
          set -euo pipefail
          echo "${SUMMARY}"
          echo "${SUMMARY}" | grep -P '^codeql\tskipped\tCodeQL requires GHAS on private repos$'

  dotnet-pack-version-unit-tests:
    name: dotnet-pack-version-unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Run parse-nupkg-version unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/dotnet-pack-version/parse-nupkg-version.test.js

  dotnet-pack-version-smoke:
    name: dotnet-pack-version-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      # actions/setup-node v4.1.0 (the action's MinVer-detect step shells
      # out to `node` against the shim).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      # actions/setup-dotnet v4.1.0 — reuses iter-1.2-verified pin per D11.
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: '8.0.x'

      # --- minimal fixture (MinVer ref present) -------------------------
      - name: dotnet-pack-version — minimal fixture (MinVer present)
        id: pack_minimal
        uses: ./.hashira/.github/actions/dotnet-pack-version
        with:
          working_directory: tests/dotnet-pack-version/fixtures/minimal
          project_path: Project.csproj
          output_directory: ./packages
      - name: Assert minimal fixture produced a version + nupkg
        shell: bash
        env:
          VERSION: ${{ steps.pack_minimal.outputs.version }}
          NUPKG_PATH: ${{ steps.pack_minimal.outputs.nupkg_path }}
        run: |
          set -euo pipefail
          echo "version='${VERSION}'  nupkg_path='${NUPKG_PATH}'"
          if [ -z "${VERSION}" ]; then
            echo "::error::dotnet-pack-version-smoke: version output is empty" >&2
            exit 1
          fi
          test -f "tests/dotnet-pack-version/fixtures/minimal/${NUPKG_PATH}"

      # --- no-MinVer fixture (warning path) -----------------------------
      # Capture stderr to assert the ::warning:: line fires. The action's
      # warning step does NOT fail the build (intentional — consumer may
      # use a different versioning scheme), so we need to scrape the
      # workflow command stream rather than depend on a non-zero exit.
      - name: dotnet-pack-version — no-MinVer fixture (warning path)
        id: pack_no_minver
        uses: ./.hashira/.github/actions/dotnet-pack-version
        with:
          working_directory: tests/dotnet-pack-version/fixtures/no-minver
          project_path: Project.csproj
          output_directory: ./packages
      - name: Assert no-MinVer fixture still produced a nupkg (warning path)
        shell: bash
        env:
          VERSION: ${{ steps.pack_no_minver.outputs.version }}
        run: |
          set -euo pipefail
          # The fixture pins <Version>0.0.1</Version> so pack still
          # succeeds; the warning is the contract surface.
          if [ -z "${VERSION}" ]; then
            echo "::error::dotnet-pack-version-smoke: no-MinVer fixture should still pack (Version is pinned in .csproj)" >&2
            exit 1
          fi
          # The summary line for both fixtures shows "produced"; we
          # primarily rely on the ::warning:: surfacing in the run-log,
          # which actionlint + the smoke job's run-log carry. We assert
          # the version is the pinned 0.0.1 (proves MinVer didn't run).
          if [ "${VERSION}" != "0.0.1" ]; then
            echo "::error::dotnet-pack-version-smoke: no-MinVer fixture should report version 0.0.1, got '${VERSION}'" >&2
            exit 1
          fi

  nuget-package-ci-shape-validation:
    name: nuget-package-ci-shape-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify python3 + pyyaml availability
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("pyyaml " + yaml.__version__)'
      - name: Run nuget-package-ci shape-validation shim
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/nuget-package-ci/shape-validate.py

  nuget-push-smoke:
    name: nuget-push-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Force the action into dry-run; no real push attempt, no need for
      # a real .nupkg on disk. Documented reserved env name; do NOT set
      # in consumer workflows.
      HASHIRA_NUGET_PUSH_DRY_RUN: '1'
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      - name: nuget-push — dry-run against a fake path
        uses: ./.hashira/.github/actions/nuget-push
        with:
          # Path does not need to exist in dry-run mode; the action exits
          # before touching the filesystem.
          nupkg_path: ./packages/Fake.0.0.0.nupkg
          api_key: ''
      - name: Assert dry-run summary line is present
        shell: bash
        run: |
          set -euo pipefail
          echo "nuget-push-smoke: action step passed (dry-run path exercised by HASHIRA_NUGET_PUSH_DRY_RUN=1)"

  nuget-package-publish-shape-validation:
    name: nuget-package-publish-shape-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify python3 + pyyaml availability
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("pyyaml " + yaml.__version__)'
      - name: Run nuget-package-publish shape-validation shim
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/nuget-package-publish/shape-validate.py

  nuget-publish-docs-cross-reference:
    name: nuget-publish-docs-cross-reference
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify python3 + pyyaml availability
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("pyyaml " + yaml.__version__)'
      - name: Run nuget docs-vs-YAML cross-reference check
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/nuget-package-publish/docs-cross-ref.py

  pages-upload-shape-smoke:
    name: pages-upload-shape-smoke
    runs-on: ubuntu-latest
    # The action documents `id-token: write` + `pages: write` as required
    # by the upstream upload-pages-artifact step; the dry-run hook below
    # skips that step so we don't actually need those scopes for this
    # smoke. Keep the job at `contents: read` only — the smoke proves the
    # autodetect + summary path, NOT the real upload.
    permissions:
      contents: read
    env:
      # Force the action's resolve step to run but skip the third-party
      # upload step. Documented reserved env name; do NOT set in consumer
      # workflows. See iter 4.1 phase brief: the library repo deliberately
      # does NOT enable Pages on itself.
      HASHIRA_PAGES_UPLOAD_DRY_RUN: '1'
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      - name: pages-upload — explicit path against tests/pages-fixture
        id: pu
        uses: ./.hashira/.github/actions/pages-upload
        with:
          path: tests/pages-fixture
      - name: Assert explicit-path outputs + summary line
        shell: bash
        env:
          RESOLVED: ${{ steps.pu.outputs.resolved_path }}
          MODE: ${{ steps.pu.outputs.detection_mode }}
        run: |
          set -euo pipefail
          echo "resolved='${RESOLVED}'  mode='${MODE}'"
          if [ "${RESOLVED}" != "tests/pages-fixture" ]; then
            echo "::error::pages-upload-shape-smoke: resolved_path expected 'tests/pages-fixture', got '${RESOLVED}'" >&2
            exit 1
          fi
          if [ "${MODE}" != "explicit" ]; then
            echo "::error::pages-upload-shape-smoke: detection_mode expected 'explicit', got '${MODE}'" >&2
            exit 1
          fi
          # resolved_path + detection_mode outputs are the canonical assertions;
          # GITHUB_STEP_SUMMARY is not accessible across steps (per-step file).

  pages-upload-autodetect-smoke:
    name: pages-upload-autodetect-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HASHIRA_PAGES_UPLOAD_DRY_RUN: '1'
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # D14 self-checkout: composite actions reference library from .hashira/
      - name: Checkout library into .hashira
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .hashira
          persist-credentials: false
      - name: Stage tests/pages-fixture into a dist/ directory at repo root
        shell: bash
        run: |
          set -euo pipefail
          # Autodetect search order is dist/ build/ out/ public/ — first
          # found wins. Copy the fixture into dist/ so autodetect picks it
          # up at the first search step. (Cannot rename the fixture
          # in-place: the explicit-path smoke job runs against
          # tests/pages-fixture.)
          mkdir -p dist
          cp tests/pages-fixture/index.html tests/pages-fixture/styles.css dist/
          ls -la dist/
      - name: pages-upload — no path input; autodetect should find dist/
        id: pu
        uses: ./.hashira/.github/actions/pages-upload
      - name: Assert autodetect resolved to dist/
        shell: bash
        env:
          RESOLVED: ${{ steps.pu.outputs.resolved_path }}
          MODE: ${{ steps.pu.outputs.detection_mode }}
        run: |
          set -euo pipefail
          echo "resolved='${RESOLVED}'  mode='${MODE}'"
          if [ "${RESOLVED}" != "dist" ]; then
            echo "::error::pages-upload-autodetect-smoke: resolved_path expected 'dist', got '${RESOLVED}'" >&2
            exit 1
          fi
          if [ "${MODE}" != "autodetect" ]; then
            echo "::error::pages-upload-autodetect-smoke: detection_mode expected 'autodetect', got '${MODE}'" >&2
            exit 1
          fi
          # resolved_path + detection_mode outputs verified above; GITHUB_STEP_SUMMARY not accessible across steps.
      - name: Clean up staged dist/
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          test ! -d dist && echo "dist removed"

