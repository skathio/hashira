    # own distinct, correctly-attributed reason (no conflation between the
    # two check kinds) — and that all three real CD composites stay clean
    # under both checks (the lint's actual happy-path target).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
