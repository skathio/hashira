  library-self-sha-contract:
    name: library-self-sha-contract
    # Static contract for the v3 library self-checkout: the three CI
    # workflows take no input naming the library commit, check their composite actions
    # out into .hashira/ at a ref resolved at run time (never a caller input,
    # never the caller's commit), and the docs no longer mention the input.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2. Full history so the test can find the
      # merge base with main when it looks for newly added lib/ files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Make main resolvable for the merge-base lookup
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet refs/heads/main >/dev/null \
            || git branch main origin/main
      - name: Verify python3 + pyyaml availability
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("pyyaml " + yaml.__version__)'
      - name: Run the library self-SHA contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/library-self-sha/test_library_self_sha.py

  library-self-sha-call:
    name: library-self-sha-call
    # Calls a consumer CI workflow for real, at this run's commit, against
    # the in-repo .NET fixture. Its `library_sha` output is the commit the
    # workflow actually checked its composite actions out at;
    # library-self-sha-assert checks it equals the commit of the call.
    uses: ./.github/workflows/nuget-package-ci.yml
    # The called workflow can only narrow these grants.
    permissions:
      contents: read
      # coverage-report's sticky PR comment, inside the called `test` job.
      pull-requests: write
      # scan-suite grants security-events:write for CodeQL when enabled.
      security-events: write
    with:
      project_path: tests/run-tests-dotnet/Fixture.Tests.csproj
      # The quality-gate job above already gates this pull request; running
      # it again inside this call would only repeat the same check.
      quality_gate: false

  library-self-sha-assert:
    name: library-self-sha-assert
    needs: library-self-sha-call
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Assert the checked-out library SHA equals the called SHA
        shell: bash
        env:
          # A local `./` call loads the called workflow from the same commit
          # as this workflow, so that commit is the SHA it was called at.
          CALLED_AT: ${{ github.workflow_sha }}
          LIBRARY_SHA: ${{ needs.library-self-sha-call.outputs.library_sha }}
        run: |
          set -euo pipefail
          if [[ "${LIBRARY_SHA}" != "${CALLED_AT}" ]]; then
            echo "::error::nuget-package-ci was called at ${CALLED_AT} but checked its composite actions out at '${LIBRARY_SHA}'."
            exit 1
          fi
          echo "library self-SHA: called at ${CALLED_AT}, composite actions checked out at ${LIBRARY_SHA}" >> "${GITHUB_STEP_SUMMARY}"

  composite-shape-invariant-lint:
    name: composite-shape-invariant-lint
    # Phase 5 iteration 5.1 (security.md B3/§2 corollary (1); NFR-Sec-1;
    # decisions.md; FR-15). Two structural checks against the three CD
    # composite actions (nuget-push, npm-release, pages-deploy):
    #   1. no `uses:` step resolving to a `.github/workflows/*.yml` path
    #      (same-repo or cross-repo) — re-introducing a `workflow_call`
    #      boundary inside a CD composite would break the OIDC token's
    #      `job_workflow_ref` claim match (AP1).
    #   2. no CD-side stamp — no step writing to package.json/.nuspec/
    #      assembly-version metadata (Phase 3.4's "consume the CI-stamped
    #      artifact byte-identical" invariant, NFR-Rel-1, mechanized).
    # Single-hop by design (inspects each composite's own action.yml only,
    # not transitively through a local composite it itself calls — none of
    # the current three chain to another local composite). Pure static
    # shape check: PyYAML tree-walk (collect_uses-style, per the
    # architectural precedent tests/npm-package-ci/shape-validate.py set —
    # NOT tests/dual-pin/lint.py's lexical regex approach, since this is a
    # structural tree-reachability question), no registry credentials
    # needed. See tests/shape-lints/no-nested-reusable-workflow.py's module
    # docstring for the full reasoning and CHECK 2's honestly-documented
    # textual-scan limitations.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify python3 + pyyaml availability
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("pyyaml " + yaml.__version__)'
      - name: Run composite-shape invariant lint
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/shape-lints/no-nested-reusable-workflow.py

  composite-shape-invariant-lint-self-test:
    name: composite-shape-invariant-lint-self-test
    # Regression lock for the lint's negative-test fixtures (acceptance
    # criterion, phase 5 iteration 5.1): proves CHECK 1 fails closed on a
    # same-repo nested reusable-workflow uses: (fixtures/
    # nested-reusable-workflow-same-repo.yml) and a cross-repo one
    # (fixtures/nested-reusable-workflow-cross-repo.yml), and CHECK 2 fails
    # closed on a package.json stamp (fixtures/cd-side-stamp-package-json.yml)
