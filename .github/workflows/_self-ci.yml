    name: gate-lints
    # Phase 5 iteration 5.2 (decisions.md D12; security.md B8; FR-15). Two
    # small, unrelated checks bundled in one shim:
    #   CHECK A — every gated publish/deploy job in docs/flows/*.md's main
    #     caller-workflow example declares an `environment:` key (D12's
    #     only mechanizable defense-in-depth half — the library cannot
