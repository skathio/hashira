    name: composite-shape-invariant-lint-self-test
    # Regression lock for the lint's negative-test fixtures (acceptance
    # criterion, phase 5 iteration 5.1): proves CHECK 1 fails closed on a
    # same-repo nested reusable-workflow uses: (fixtures/
    # nested-reusable-workflow-same-repo.yml) and a cross-repo one
    # (fixtures/nested-reusable-workflow-cross-repo.yml), and CHECK 2 fails
    # closed on a package.json stamp (fixtures/cd-side-stamp-package-json.yml)
