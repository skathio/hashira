# Reusable workflow: nuget-package-ci (CI half of the NuGet flow per D8).
#
# Runs restore-build → test (in series; tests consume build outputs) plus
# scan-suite in parallel. Coverage is reported INSIDE the test job: the
# cobertura file run-tests-dotnet standardizes only exists in the test
# job's workspace. A separate `coverage-report` job ran on a fresh runner
# with no artifact handoff, so it always failed "file not found" — this
# was a known, tracked gap (iter 2.3 review) that went unnoticed until
# rogue's iter-6.3/6.4 live migration actually exercised this workflow as
# a real `workflow_call` for the first time. Removed entirely (hashira-v2
# iteration 6.5) rather than wired up with an artifact handoff, since
# coverage reporting already works correctly inside the `test` job above.
# The Publish half is `nuget-push` (a composite action invoked directly
# from the consumer's own job, per D2 — not a reusable workflow; the old
# `nuget-package-publish.yml` reusable workflow was retired in iteration
# 3.2).
#
# ## Version resolution + stamp (D1/D8, iteration 2.3)
#
# A `version` job, gated at the JOB level on `inputs.bump != ''`, resolves
# the next release version via `.github/actions/version-resolver` and packs
# it via `.github/actions/dotnet-pack-version` with the resolved version
# passed as `version_override` — never into the checked-out working tree
# (D1's stamp-only, no-commit-back invariant; verified by a `git status`
# assertion step, same shape as `npm-package-ci.yml` iteration 2.2). When
# `bump` is empty (every routine PR/push CI run that isn't cutting a
# release) the `version` job is skipped entirely and every other job runs
# exactly as before this iteration — `version` neither gates nor is gated
# by `setup`/`restore-build`/`test`/`scan-suite` (coverage reporting is a
# step inside `test`, not its own job — see the header note above).
#
# MinVer-stamping decision (phase 2 exit criteria, iteration 2.3): MinVer is
# RETAINED, not replaced. `dotnet-pack-version`'s new `version_override`
# input sets MinVer's own `MinVerVersionOverride` MSBuild property, which
# MinVer reads verbatim instead of inferring from git tag history when
# non-empty. Packing still goes through ordinary `dotnet pack` + MinVer;
# explicit (the resolver's output) always wins over inferred (MinVer's tag
# walk). Verified directly against a fixture repo: with `version_override`
# set, the produced `.nuspec`'s `<version>` and the assembly's
# informational version both reflect the override, not the tag-inferred
# guess — proving the override genuinely wins, not just happens to match.
#
# CI->CD output-boundary contract (D8, phase 2 exit criteria "Major 3 fix"):
# this workflow declares exactly ONE workflow-level output, `resolved_version`
# — the resolver's single scalar, mapped straight through
# (`jobs.version.outputs.resolved_version` <- `steps.resolve.outputs.version`).
# No second output for the `v`-prefixed tag form or the bump kind. A
# consumer's CD job reads it via
# `needs.<this-job-id>.outputs.resolved_version` and derives the `v`-prefix
# itself (`v${{ needs.ci.outputs.resolved_version }}`).
#
# ## Same-run artifact handoff (mirrors npm-package-ci.yml iteration 2.2)
#
# The packed `.nupkg` (`${RUNNER_TEMP}/hashira-pack-output/*.nupkg`) is
# uploaded via `actions/upload-artifact` under the stable name
# `nuget-package`, `retention-days: 5`. Phase 3's CD job downloads this
# exact artifact by name (`actions/download-artifact`) to publish — it MUST
# NOT re-pack from a fresh checkout, which would silently break the
# byte-identical guarantee NFR-Rel-1 requires.
#
# ## Permissions baseline (NF6)
#
# Workflow-level `permissions: {}` (deny-all). Each job grants the
# minimum it needs:
#   - setup          : contents:read
#   - version        : contents:read (resolver + pack/stamp; no
#                      working-tree write)
#   - restore-build  : contents:read
#   - test           : contents:read, pull-requests:write (coverage runs
#                      here now and posts the sticky comment — see below)
#   - scan-suite     : contents:read, security-events:write (CodeQL),
#                      pull-requests:read (dependency-review on PR)
#
# Reusable workflows can only NARROW the caller's grants, never broaden.
# Consumers must mirror this matrix at their caller job's `permissions:`
# block (documented in `docs/usage.md` and `docs/flows/nuget.md`).
#
# ## No commitlint (intentional)
#
# Unlike `npm-package-ci.yml`, this workflow does NOT run commitlint.
# .NET projects don't have a Conventional-Commits equivalent worth
# wiring in by default — semantic-release is the npm flow's reason for
# CC; the NuGet flow uses MinVer for version inference (driven by git
# tags, not commit message shapes) per phase 3 design. Consumers who
# want commitlint on a .NET repo are welcome to wire it independently
# in their caller workflow; the library doesn't impose it.
#
# ## Secret preflight (spec §8)
#
# The CI half has no required secrets. A no-op `preflight` step exists
# in the `setup` job documenting the pattern; the Publish half (iter
# 3.3) copies the structure for real `NUGET_API_KEY` presence/shape
# checks.
#
# ## SHA pins (NF2)
#
# All third-party `uses:` refs are pinned to a full 40-char commit SHA
# with an inline version comment. Pins reused from iter 1.2 (verified
# upstream against the actions' release tags).
#
# ## Runtime contract: library-self-checkout via `library_ref` (D14)
#
# In-repo composite actions live at `.github/actions/<name>` in the
# `skathio/hashira` repo. When this workflow is invoked from a
# consumer repo, the consumer's `$GITHUB_WORKSPACE` contains the
# consumer's files, not the library's. GitHub's `uses:` keyword does
# NOT permit expressions in the `@<ref>` portion (workflow-load-time
# parse, before expression evaluation), so the originally-proposed
# shape `uses: skathio/hashira/.github/actions/<name>@${{
# inputs.library_ref }}` is rejected by the runtime.
#
# Resolution (D14): every job that consumes an in-repo composite
# action first checks out `skathio/hashira` at
# `${{ inputs.library_ref }}` into the reserved subdirectory
# `.hashira/` with `persist-credentials: false` (iter-2.3 security
# review m4). The composite-action `uses:` refs are then literal local
# paths `uses: ./.hashira/.github/actions/<name>` (no expressions,
# satisfies the load-time parser). The `library_ref` is substituted
# at runtime through `actions/checkout`'s `ref:` input (where
# expressions ARE permitted because it's a step input, not the
# `uses:` keyword itself).
#
# `library_ref` is a REQUIRED input (no default) as of v2 phase 1
# iteration 1.1 — see decisions.md D9 / phases/01-naming-unification.md.
# v1's default ('v1', with a stale comment claiming 'main') was a
# consumer-visible contract mismatch; rather than pick a new default to
# defend, every caller must now pin explicitly. This is a
# breaking-contract change for any v1 caller relying on the implicit
# default; callers MUST pass `library_ref` explicitly going forward.
#
# Trade-off: ~1–2s overhead per job for the library checkout.
# Acceptable at v1; documented as the cost of the literal-`uses:`
# constraint.
#
# ## Trust boundary
#
# These workflow inputs flow into composite-action inputs and/or shell
# command lines downstream (run-tests-dotnet's `command`,
# coverage-report's `coverage_path`, scan-suite's `scan_disable`, and
# the `dotnet` CLI argv for restore/build/test). Per D10d this is
# permitted but requires documented conventions: treat the values as
# TRUSTED input. Do NOT pass values derived from PR titles, issue
# bodies, branch names, commit messages, fork-author-controlled tag
# names, or any other externally controlled context — quoting cannot
# defend the downstream sinks.
#   - dotnet_version
#   - project_path
#   - test_filter
#   - coverage_path
#   - scan_disable
#   - library_ref
#   - bump            (gates the `version` job; resolver input, see above)
#   - seed_version     (resolver input, see above)
# See `docs/usage.md` for the full trust model.

name: nuget-package-ci

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: "Dotnet SDK version (channel) to install via actions/setup-dotnet. Default '8.0.x'."
        required: false
        type: string
        default: "8.0.x"
      project_path:
        description: "Path to the .csproj or .sln to restore/build/test. Trusted input (interpolated into `dotnet` CLI argv)."
        required: true
        type: string
      test_filter:
        description: "Optional `dotnet test --filter` expression. Empty string runs all tests. Trusted input (interpolated into `dotnet` CLI argv)."
        required: false
        type: string
        default: ""
      coverage_path:
        description: "Path to the cobertura coverage file produced by `dotnet test --collect:\"XPlat Code Coverage\"`. Default 'coverage/cobertura.xml'."
        required: false
        type: string
        default: "coverage/cobertura.xml"
      scan_disable:
        description: "Comma-separated list of scans to skip (D10c). Default 'codeql,actionlint' — pass '' to enable all. Values: codeql,osv,gitleaks,dependency-review,actionlint."
        required: false
        type: string
        default: "codeql,actionlint"
      library_ref:
        description: "SHA, tag, or branch of skathio/hashira to check out for in-repo composite actions (D14). REQUIRED — no default (v2 phase 1 iteration 1.1). PIN TO A SHA for reproducible consumer builds."
        required: true
        type: string
      bump:
        description: "One of 'patch' | 'minor' | 'major'. OPTIONAL — leave empty/unset for routine PR/push CI runs that aren't cutting a release. When set, the version job resolves the next version, surfaces it in the run summary, and packs it via dotnet-pack-version's `version_override` (MinVer's tag-inference is overridden, never the working tree) (D1/D8). Empty by default so every non-release CI run is unaffected."
        required: false
        type: string
        default: ""
      seed_version:
        description: "Bare semver baseline (e.g. '0.0.0') for a major/initial release with no prior stable tag (FR-3). Passed through to the version-resolver action unchanged; ignored when a stable tag already exists or when 'bump' is empty."
        required: false
        type: string
        default: ""
    outputs:
      # CI->CD output-boundary contract (D8 / phases/02-version-resolver.md
      # exit criteria, "Major 3 fix"): exactly ONE workflow-level output,
      # mapped straight through from the version job's single scalar. No
      # second output for the `v`-prefixed tag form or the bump kind — the
      # consumer's CD job derives those locally
      # (`v${{ needs.<ci-job-id>.outputs.resolved_version }}`, and `bump` is
      # already its own dispatch input). Empty when `bump` was not provided
      # (the `version` job did not run).
      resolved_version:
        description: "The resolved, validated bare semver string (e.g. '1.3.0', no 'v' prefix). Empty when 'bump' was not provided. The workflow's only output (D8)."
        value: ${{ jobs.version.outputs.resolved_version }}

# Deny-all baseline; jobs grant the minimum.
permissions: {}

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-dotnet v4.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      - name: Secret preflight (no-op for CI half)
        shell: bash
        run: |
          set -euo pipefail
          # CI half requires no secrets. The preflight pattern is
          # documented here for symmetry with the Publish half which
          # validates NUGET_API_KEY presence + shape per spec §8.
          echo "nuget-package-ci: secret preflight (no secrets required for CI)"

  # Resolves + stamps the release version (D1/D8). Gated at the JOB level on
  # `inputs.bump != ''` so a routine PR/push CI run (bump unset) skips this
  # job entirely — no resolver invocation, no checkout-with-full-tags, no
  # pack/stamp work — and shows as "skipped" rather than running pointless
  # steps behind a step-level `if:`. Deliberately independent of `setup`/
  # `restore-build`/`test`/`scan-suite`: nothing here gates them and nothing
  # here is gated by them, so existing CI behavior for
  # non-release runs is provably unaffected by this job's presence. Mirrors
  # `npm-package-ci.yml` iteration 2.2's `version` job shape exactly.
  version:
    name: version
    if: ${{ inputs.bump != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      resolved_version: ${{ steps.resolve.outputs.version }}
    steps:
      # actions/checkout v4.2.2 — consumer's tree. Full history + tags
      # (fetch-depth: 0, fetch-tags: true) so the resolver can see the real
      # tag list via `git tag --list` below; the other jobs' shallow
      # checkout is intentionally left as-is (they don't need tag history).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true
      # Library self-checkout per D14: ./.hashira/ holds hashira at library_ref.
      - name: Checkout hashira library (D14)
        # actions/checkout v4.2.2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: skathio/hashira
          ref: ${{ inputs.library_ref }}
          path: .hashira
          persist-credentials: false
      # actions/setup-dotnet v4.1.0 — needed for `dotnet pack` below.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      # actions/setup-node v4.1.0 — version-resolver's shim shells out to
      # `node` (D8's resolver action; same precedent as npm-package-ci.yml).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Gather tag list
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          # Newline-separated tag list, the shape version-resolver expects
          # (security.md B7: passed via env below, never interpolated into
          # a `run:` string by the resolver itself).
          tag_list="$(git tag --list)"
          {
            echo "tags<<HASHIRA_TAGS_EOF"
            echo "${tag_list}"
            echo "HASHIRA_TAGS_EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Resolve next version
        id: resolve
        uses: ./.hashira/.github/actions/version-resolver
        with:
          tags: ${{ steps.tags.outputs.tags }}
          bump: ${{ inputs.bump }}
          seed_version: ${{ inputs.seed_version }}
      - name: Surface resolved version in run summary (NFR-DX-3)
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          echo "nuget-package-ci: resolved version ${RESOLVED_VERSION} (bump=${BUMP})" >> "${GITHUB_STEP_SUMMARY}"
      - name: Snapshot working tree into isolated pack staging dir (D1 — stamp-only, no commit-back)
        shell: bash
        run: |
          set -euo pipefail
          # Pack from an ISOLATED COPY of the working tree, never the
          # checked-out tree itself. This is the mechanism that makes the
          # "no commit-back" invariant (D1) true by construction rather than
          # by discipline: the consumer's project file in $GITHUB_WORKSPACE
          # is never opened for writing — MinVerVersionOverride below tells
          # MinVer what version to stamp; nothing rewrites the .csproj.
          #
          # `.hashira` is the D14 library self-checkout for THIS job, not
          # part of the consumer's package — excluded so the hashira library
          # source can never end up inside the packed .nupkg (mirrors
          # npm-package-ci.yml iteration 2.2 pass-1 review Major #2; `dotnet
          # pack`'s default file selection is "everything under the project
          # directory the SDK considers part of the project," which is a
          # different rule than npm's `.npmignore`/`files` allowlist, so the
          # exclude has to happen here, before pack ever runs, not be left to
          # dotnet's own file-selection rules).
          #
          # IMPORTANT: `.git` is excluded too, which means MinVer has ZERO
          # git tag history available inside this staged copy — its
          # tag-inference fallback is structurally unreachable here, not
          # just "overridden by preference." `version_override` (below) is
          # therefore the ONLY viable version source on this path; an empty
          # override would not fall back to a real tag-inferred guess, it
          # would fall back to MinVer's own no-history default (0.0.0-*).
          # This job only ever runs with a non-empty override (gated on
          # `bump != ''`, which always resolves a version first), so this is
          # not a live risk today — but a future caller of
          # `dotnet-pack-version` from a similarly `.git`-less tree (e.g. a
          # consumer composing it directly per D10) must pass an explicit
          # `version_override`; it cannot rely on tag-inference as a
          # fallback (pass-1 review, iteration 2.3, Major — verification
          # rigor; see diary).
          pack_dir="${RUNNER_TEMP}/hashira-pack"
          rm -rf "${pack_dir}"
          mkdir -p "${pack_dir}"
          rsync -a --exclude='.git' --exclude='.hashira' --exclude="${pack_dir}" ./ "${pack_dir}/"
      - name: Pack with stamped version via dotnet-pack-version (D1 — stamp-only, no commit-back)
        id: pack
        uses: ./.hashira/.github/actions/dotnet-pack-version
        with:
          working_directory: ${{ runner.temp }}/hashira-pack
          project_path: ${{ inputs.project_path }}
          output_directory: ${{ runner.temp }}/hashira-pack-output
          # The resolver's two-checkpoint-validated scalar wins over MinVer's
          # tag inference (phase 2.3's MinVer-stamping decision). MinVer is
          # RETAINED — packing still goes through ordinary `dotnet pack`;
          # only the version source changes from "infer from tags" to
          # "explicit, dispatch-resolved."
          version_override: ${{ steps.resolve.outputs.version }}
      - name: Assert packed version matches the resolved version
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
          PACKED_VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          # dotnet-pack-version's own `version` output is parsed straight
          # from the produced .nupkg's filename (mechanical, not MinVer's
          # log output) — comparing it to the resolver's output is an
          # end-to-end proof that `version_override` actually reached the
          # packed artifact, not just that the input was passed.
          if [ "${PACKED_VERSION}" != "${RESOLVED_VERSION}" ]; then
            echo "::error::nuget-package-ci: packed .nupkg version '${PACKED_VERSION}' does not match resolved version '${RESOLVED_VERSION}' — MinVerVersionOverride did not win over tag inference" >&2
            exit 1
          fi
          echo "nuget-package-ci: packed .nupkg version ${PACKED_VERSION} matches resolved version" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload packed .nupkg (same-run CI->CD artifact handoff)
        # actions/upload-artifact v4.4.3 — same pin already verified and in
        # use at .github/actions/coverage-report/action.yml and
        # npm-package-ci.yml's iter-2.2 `version` job; reused here rather
        # than introducing a new pin to the verified-pin set.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Stable, documented name: Phase 3's CD job downloads this exact
          # name to publish "the same-run artifact" (sdd.md §8's open item).
          # Re-packing in the CD job instead of downloading this artifact is
          # explicitly forbidden by phases/03-cd-composite-normalization.md
          # — it would silently break the byte-identical guarantee
          # NFR-Rel-1 requires.
          name: nuget-package
          path: ${{ runner.temp }}/hashira-pack-output/*.nupkg
          if-no-files-found: error
          # Same 5-day rationale as npm-package-ci.yml iteration 2.2: covers
          # the gap between "CI cuts a release" and "a maintainer
          # triggers/approves the CD publish job" (FR-8) without keeping
          # stale release artifacts around indefinitely.
          retention-days: 5
      - name: Assert stamp did not touch the checked-out working tree
        shell: bash
        run: |
          set -euo pipefail
          # D1's stamp-only / no-commit-back invariant: every write above
          # landed only inside $RUNNER_TEMP (outside $GITHUB_WORKSPACE).
          # This assertion proves it rather than just asserting it by
          # convention.
          #
          # `--untracked-files=no` is deliberate (npm-package-ci.yml
          # iteration 2.2 pass-1 review, Blocker): the D14 library
          # self-checkout above lands `.hashira/` as UNTRACKED content in
          # $GITHUB_WORKSPACE, and nothing gitignores it. Bare `git status
          # --porcelain` reports untracked files too, so without this flag
          # the assertion would fire on every real release, not just one
          # where the working tree was actually modified. The iteration's
          # own acceptance criterion is "no TRACKED-file diff outside the
          # artifact output path" (phases/02-version-resolver.md) — scoping
          # to tracked content is what D1 actually requires; it still
          # catches any modification to a tracked file (the real
          # invariant), it just stops flagging the expected, harmless
          # `.hashira/` self-checkout dir as a violation.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::nuget-package-ci: working tree changed during version/pack steps — stamp must only touch the packed output, never the checked-out tree" >&2
            git status --porcelain --untracked-files=no >&2
            exit 1
          fi
          echo "nuget-package-ci: git status (tracked files) clean after stamp — no commit-back occurred" >> "${GITHUB_STEP_SUMMARY}"

  restore-build:
    name: restore-build
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-dotnet v4.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      - name: Restore + build
        shell: bash
        env:
          NC_PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          # Quoting via env var per the iter-2.1/2.3 trust-boundary pattern.
          dotnet restore "${NC_PROJECT_PATH}"
          dotnet build "${NC_PROJECT_PATH}" --configuration Release --no-restore

  test:
    name: test
    # Depends on restore-build as a fail-fast gate: if compile is broken,
    # we want to surface that BEFORE spinning up the test runner. Tests
    # re-run `dotnet restore` + build implicitly (no `--no-build` flag)
    # because GitHub Actions jobs don't share a filesystem and we
    # deliberately avoid `actions/upload-artifact` + `download-artifact`
    # cross-job handoff here (would add a new third-party SHA pin
    # outside this iteration's verified-pin set; see diary note from
    # iter 3.2). Cost: ~one extra restore+build per CI run. Acceptable
    # at v1; revisit if NuGet consumers' build times grow painful.
    # Asymmetric vs npm flow (which runs lint ∥ test ∥ scan-suite).
    needs: restore-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # coverage-report (run as the last step of this job) posts a sticky PR
      # comment via actions/github-script on pull_request events.
      pull-requests: write
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-dotnet v4.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      # Library self-checkout per D14 (persist-credentials:false per iter-2.3 m4).
      - name: Checkout hashira library (D14)
        # actions/checkout v4.2.2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: skathio/hashira
          ref: ${{ inputs.library_ref }}
          path: .hashira
          persist-credentials: false
      - name: Run tests
        uses: ./.hashira/.github/actions/run-tests-dotnet
        with:
          # Build the dotnet test command at this layer so test_filter can
          # be omitted cleanly when empty (avoids a stray `--filter ''`
          # that the dotnet CLI rejects on some 8.0.x patch versions).
          #
          # Iter-3.2 review Minor #2: the filter value is wrapped in SINGLE
          # quotes (`--filter '{1}'`) rather than double quotes. xUnit /
          # MSTest filter expressions commonly carry literal `"` around
          # property values (`Category="Integration"`, `FullyQualifiedName!="X"`)
          # but do NOT use single quotes — single-quote wrapping is the
          # safer envelope. project_path is a path; single quotes around it
          # are also safe (paths don't contain `'` on any realistic .NET
          # repo layout, and the trust-boundary block forbids deriving
          # project_path from externally-controlled context anyway).
          command: ${{ inputs.test_filter == '' && format('dotnet test ''{0}'' --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults', inputs.project_path) || format('dotnet test ''{0}'' --configuration Release --filter ''{1}'' --collect:"XPlat Code Coverage" --results-directory TestResults', inputs.project_path, inputs.test_filter) }}
          coverage_path: ${{ inputs.coverage_path }}
          results_directory: TestResults
      # actions/setup-node v4.1.0 — coverage-report's parser shim needs a
      # `node` binary on PATH. ubuntu-latest ships one, but pin it explicitly
      # so the dependency is visible (mirrors _self-ci.yml's actions-smoke job).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      # Report coverage IN THIS JOB: run-tests-dotnet just standardized the
      # cobertura file at `coverage_path` in this workspace, so it is present
      # here. (The former separate coverage-report job ran on a fresh runner
      # with no artifact handoff and always failed "file not found".)
      - name: Report coverage
        uses: ./.hashira/.github/actions/coverage-report
        with:
          coverage_path: ${{ inputs.coverage_path }}

  scan-suite:
    name: scan-suite
    # Parallel with restore-build/test (does not need build outputs).
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeQL needs security-events:write when enabled; granted here
      # even when codeql is in the default skip list so consumers who
      # enable it via scan_disable: '' don't hit a permissions error.
      security-events: write
      # dependency-review on PR events reads PR metadata.
      pull-requests: read
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # Library self-checkout per D14.
      - name: Checkout hashira library (D14)
        # actions/checkout v4.2.2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: skathio/hashira
          ref: ${{ inputs.library_ref }}
          path: .hashira
          persist-credentials: false
      - name: Run scan-suite
        uses: ./.hashira/.github/actions/scan-suite
        with:
          scan_disable: ${{ inputs.scan_disable }}
