# Reusable workflow: nuget-package-ci (CI half of the NuGet flow per D8).
#
# Runs restore-build → test (in series; tests consume build outputs) plus
# scan-suite in parallel. Coverage is reported INSIDE the test job: the
# cobertura file run-tests-dotnet standardizes only exists in the test
# job's workspace. A separate `coverage-report` job ran on a fresh runner
# with no artifact handoff, so it always failed "file not found" — this
# was a known, tracked gap (iter 2.3 review) that went unnoticed until
# rogue's iter-6.3/6.4 live migration actually exercised this workflow as
# a real `workflow_call` for the first time. Removed entirely (hashira-v2
# iteration 6.5) rather than wired up with an artifact handoff, since
# coverage reporting already works correctly inside the `test` job above.
# The Publish half is `nuget-push` (a composite action invoked directly
# from the consumer's own job, per D2 — not a reusable workflow; the old
# `nuget-package-publish.yml` reusable workflow was retired in iteration
# 3.2).
#
# ## Version resolution + stamp (D1/D8, iteration 2.3)
#
# A `version` job, gated at the JOB level on a non-empty bump, resolves
# the next release version via `.github/actions/version-resolver` and packs
# it via `.github/actions/dotnet-pack-version` with the resolved version
# passed as `version_override` — never into the checked-out working tree
# (D1's stamp-only, no-commit-back invariant; verified by a `git status`
# assertion step, same shape as `npm-package-ci.yml` iteration 2.2). When
# `bump` is empty (every routine PR/push CI run that isn't cutting a
# release) the `version` job is skipped entirely and every other job runs
# exactly as before this iteration — `version` needs only `setup` (for the
# library commit) and neither gates nor is gated by
# `restore-build`/`test`/`scan-suite` (coverage reporting is a
# step inside `test`, not its own job — see the header note above).
#
# MinVer-stamping decision (phase 2 exit criteria, iteration 2.3): MinVer is
# RETAINED, not replaced. `dotnet-pack-version`'s new `version_override`
# input sets MinVer's own `MinVerVersionOverride` MSBuild property, which
# MinVer reads verbatim instead of inferring from git tag history when
# non-empty. Packing still goes through ordinary `dotnet pack` + MinVer;
# explicit (the resolver's output) always wins over inferred (MinVer's tag
# walk). Verified directly against a fixture repo: with `version_override`
# set, the produced `.nuspec`'s `<version>` and the assembly's
# informational version both reflect the override, not the tag-inferred
# guess — proving the override genuinely wins, not just happens to match.
#
# CI->CD output-boundary contract (D8, phase 2 exit criteria "Major 3 fix"):
# this workflow declares exactly ONE version output, `resolved_version`
# — the resolver's single scalar, mapped straight through
# (`jobs.version.outputs.resolved_version` <- `steps.resolve.outputs.version`).
# No second output for the `v`-prefixed tag form or the bump kind. A
# consumer's CD job reads it via
# `needs.<this-job-id>.outputs.resolved_version` and derives the `v`-prefix
# itself (`v${{ needs.ci.outputs.resolved_version }}`).
#
# ## Same-run artifact handoff (mirrors npm-package-ci.yml iteration 2.2)
#
# The packed `.nupkg` (`${RUNNER_TEMP}/hashira-pack-output/*.nupkg`) is
# uploaded via `actions/upload-artifact` under the stable name
# `nuget-package`, `retention-days: 5`. Phase 3's CD job downloads this
# exact artifact by name (`actions/download-artifact`) to publish — it MUST
# NOT re-pack from a fresh checkout, which would silently break the
# byte-identical guarantee NFR-Rel-1 requires.
#
# ## Permissions baseline (NF6)
#
# Workflow-level `permissions: {}` (deny-all). Each job grants the
# minimum it needs:
#   - setup          : contents:read
#   - version        : contents:read (resolver + pack/stamp; no
#                      working-tree write)
#   - restore-build  : contents:read
#   - test           : contents:read
#   - scan-suite     : contents:read, security-events:write (CodeQL),
#                      pull-requests:read (dependency-review on PR)
#   - quality-gate   : contents:read
#   - passed         : contents:read, pull-requests:write (the one CI
#                      summary comment on the pull request; the only job
#                      with this grant)
#
# Reusable workflows can only NARROW the caller's grants, never broaden.
# Consumers must mirror this matrix at their caller job's `permissions:`
# block (documented in `docs/usage.md` and `docs/flows/nuget.md`).
#
# ## No commitlint (intentional)
#
# Unlike `npm-package-ci.yml`, this workflow does NOT run commitlint.
# .NET projects don't have a Conventional-Commits equivalent worth
# wiring in by default — semantic-release is the npm flow's reason for
# CC; the NuGet flow uses MinVer for version inference (driven by git
# tags, not commit message shapes) per phase 3 design. Consumers who
# want commitlint on a .NET repo are welcome to wire it independently
# in their caller workflow; the library doesn't impose it.
#
# ## Secret preflight (spec §8)
#
# The CI half has no required secrets. A no-op `preflight` step exists
# in the `setup` job documenting the pattern; the Publish half (iter
# 3.3) copies the structure for real `NUGET_API_KEY` presence/shape
# checks.
#
# ## SHA pins (NF2)
#
# All third-party `uses:` refs are pinned to a full 40-char commit SHA
# with an inline version comment. Pins reused from iter 1.2 (verified
# upstream against the actions' release tags).
#
# ## Runtime contract: library self-checkout at the workflow's own commit
#
# In-repo composite actions live at `.github/actions/<name>` in
# `skathio/hashira`. A consumer's `$GITHUB_WORKSPACE` holds the consumer's
# files, not the library's, and GitHub's `uses:` keyword does not accept
# expressions in its `@<ref>` portion. So every job that runs one of these
# actions first checks out `skathio/hashira` into the reserved
# subdirectory `.hashira/` (`persist-credentials: false`) and then calls it
# by the literal local path `uses: ./.hashira/.github/actions/<name>`.
#
# The checkout's ref is the commit this workflow file was itself called
# at, so a caller pinned at `@<sha>` or `@v3` runs composite actions from
# that same commit and has no second ref to keep in sync. The `setup` job
# reads it from `job.workflow_sha`, which GitHub documents as the commit of
# the workflow file that defines the current job: for a reusable workflow,
# the called file, not the caller. `github.sha` and `github.workflow_sha`
# name the caller's commit and must never be used for this checkout.
# `setup` fails when the value is not a 40-character SHA (GitHub
# Enterprise Server does not provide `job.workflow_sha`), checks the
# library out at it, and publishes the commit it actually checked out as
# its `library_sha` output. Every other job checks out
# `needs.setup.outputs.library_sha`, and the workflow exposes the same
# value as its `library_sha` output.
#
# Trade-off: ~1–2s overhead per job for the library checkout, the cost of
# the literal-`uses:` constraint.
#
# ## Trust boundary
#
# These workflow inputs flow into composite-action inputs and/or shell
# command lines downstream (run-tests-dotnet's `command`,
# coverage-report's `coverage_path`, scan-suite's `scan_disable`, and
# the `dotnet` CLI argv for restore/build/test). Per D10d this is
# permitted but requires documented conventions: treat the values as
# TRUSTED input. Do NOT pass values derived from PR titles, issue
# bodies, branch names, commit messages, fork-author-controlled tag
# names, or any other externally controlled context — quoting cannot
# defend the downstream sinks.
#   - dotnet_version
#   - project_path
#   - test_filter
#   - coverage_path
#   - scan_disable
#   - bump            (gates the `version` job; resolver input, see above)
#   - seed_version     (resolver input, see above)
# See `docs/usage.md` for the full trust model.

name: nuget-package-ci

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: "Dotnet SDK version (channel) to install via actions/setup-dotnet. Default '8.0.x'."
        required: false
        type: string
        default: "8.0.x"
      project_path:
        description: "Path to the .csproj or .sln to restore, build, test and pack. Empty (default) uses the single .csproj in the repository whose file name matches neither '*Test*.csproj' nor '*.Tests.csproj'; zero or several such files fail the setup job with an error listing them. Trusted input (interpolated into `dotnet` CLI argv)."
        required: false
        type: string
        default: ""
      test_filter:
        description: "Optional `dotnet test --filter` expression. Empty string runs all tests. Trusted input (interpolated into `dotnet` CLI argv)."
        required: false
        type: string
        default: ""
      coverage_path:
        description: "Path to the coverage file the tests write. Empty (default) uses the flow's standard path: 'coverage/lcov.info' for npm and static-webapp, 'coverage/cobertura.xml' for NuGet. Trusted input."
        required: false
        type: string
        default: ""
      scan_disable:
        description: "Comma-separated list of scans to skip (D10c). Default 'codeql' (actionlint runs by default since v3.4.0) — pass '' to enable all. Values: codeql,osv,gitleaks,dependency-review,actionlint."
        required: false
        type: string
        default: "codeql"
      scan_fail_on_findings:
        description: "Fail the scan-suite job, and so the ci / passed check, when a scanner reports findings or an error. Default true. false keeps every enabled scanner running and reported as fail in the job summary and the CI summary comment, without failing the job. A scanner turned off with scan_disable does not run at all."
        required: false
        type: boolean
        default: true
      summary_comment:
        description: "Keep one CI summary comment on the pull request, written by the passed job. Default true. false writes the same summary to the passed job's summary instead and posts no comment; the passed job keeps pull-requests: write either way, so the caller's grant is unchanged."
        required: false
        type: boolean
        default: true
      bump:
        description: "One of 'patch', 'minor' or 'major'; 'none' means no release, as empty does. Empty (default) falls back to the caller's workflow_dispatch input 'bump'; a value passed here wins. When neither is set, as on routine pull_request and push runs, no release is cut. When set, the version job resolves the next version, shows it in the run summary and stamps it into the packed release artifact, never into the checked-out tree."
        required: false
        type: string
        default: ""
      seed_version:
        description: "Bare semver baseline (e.g. '0.0.0') for a first release with no prior stable tag. Empty (default) falls back to the caller's workflow_dispatch input 'seed_version'; a value passed here wins. Passed to version-resolver unchanged; ignored when a stable tag already exists or no bump is set."
        required: false
        type: string
        default: ""
      quality_gate:
        description: "Run SoMi's quality gate on what a pull request changes. Default true; false skips the quality-gate job. The gate runs only on pull_request events; on other events it passes and says so in the job summary."
        required: false
        type: boolean
        default: true
      quality_level:
        description: "SoMi quality level for the gate: exactly 'strict' (default), 'standard' or 'relaxed'. Any other value, including '', fails the setup job."
        required: false
        type: string
        default: "strict"
    outputs:
      # CI->CD output-boundary contract (D8 / phases/02-version-resolver.md
      # exit criteria, "Major 3 fix"): exactly ONE version output,
      # mapped straight through from the version job's single scalar. No
      # second output for the `v`-prefixed tag form or the bump kind — the
      # consumer's CD job derives those locally
      # (`v${{ needs.<ci-job-id>.outputs.resolved_version }}`, and `bump` is
      # already its own dispatch input). Empty when `bump` was not provided
      # (the `version` job did not run).
      resolved_version:
        description: "The resolved, validated bare semver string (e.g. '1.3.0', no 'v' prefix). Empty when 'bump' was not provided. The workflow's only version output: the CD side derives the tag form and bump kind itself."
        value: ${{ jobs.version.outputs.resolved_version }}
      library_sha:
        description: "The skathio/hashira commit this run checked its composite actions out at: the commit this workflow file was called at."
        value: ${{ jobs.setup.outputs.library_sha }}

# Deny-all baseline; jobs grant the minimum.
permissions: {}

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The hashira commit every job checks out into .hashira/.
      library_sha: ${{ steps.library.outputs.sha }}
      # The project every job restores, builds, tests and packs.
      project_path: ${{ steps.project.outputs.path }}
    steps:
      # actions/checkout v7.0.1 — consumer's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-dotnet v6.1.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      - name: Secret preflight (no-op for CI half)
        shell: bash
        run: |
          set -euo pipefail
          # CI half requires no secrets. The preflight pattern is
          # documented here for symmetry with the Publish half which
          # validates NUGET_API_KEY presence + shape per spec §8.
          echo "nuget-package-ci: secret preflight (no secrets required for CI)"
      # A misconfigured level fails here, visibly, even when the gate is off.
      - name: Validate quality_level
        shell: bash
        env:
          QUALITY_LEVEL: ${{ inputs.quality_level }}
        run: |
          set -euo pipefail
          case "${QUALITY_LEVEL}" in
            strict|standard|relaxed) ;;
            *)
              echo "::error::nuget-package-ci: quality_level must be exactly 'strict', 'standard' or 'relaxed', got ${QUALITY_LEVEL@Q}."
              exit 1
              ;;
          esac
      # An empty project_path means the one .csproj in the repository that is
      # not a test project. Every later job builds what this step resolves.
      - name: Resolve project_path
        id: project
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          candidates=()
          if [[ -n "${PROJECT_PATH}" ]]; then
            candidates=("${PROJECT_PATH}")
          else
            while IFS= read -r -d '' file; do
              name="${file##*/}"
              [[ "${name}" == *Test*.csproj || "${name}" == *.Tests.csproj ]] && continue
              candidates+=("${file#./}")
            done < <(find . \( -name .git -o -name .hashira \) -prune -o -type f -name '*.csproj' -print0 | sort -z)
          fi
          # Checked before any name is printed: a newline in a file name would
          # let it write its own workflow command into the log.
          for candidate in "${candidates[@]}"; do
            if [[ "${candidate}" == *[[:cntrl:]]* ]]; then
              echo "::error::nuget-package-ci: a .csproj path in the repository contains a control character. Rename it."
              exit 1
            fi
          done
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            listed="none"
            if [[ "${#candidates[@]}" -gt 0 ]]; then
              listed="$(printf '%s, ' "${candidates[@]}")"
              listed="${listed%, }"
            fi
            echo "::error::nuget-package-ci: project_path is empty and the repository holds ${#candidates[@]} .csproj files that are not test projects (named neither *Test*.csproj nor *.Tests.csproj), expected exactly one: ${listed}. Set project_path."
            exit 1
          fi
          # The test job puts the path inside single quotes in a shell
          # command, so a quote in a file name would end the quoting there.
          if [[ "${candidates[0]}" == *"'"* ]]; then
            echo "::error::nuget-package-ci: the project path ${candidates[0]@Q} contains a single quote, which the test command cannot quote safely. Rename the file."
            exit 1
          fi
          echo "path=${candidates[0]}" >> "${GITHUB_OUTPUT}"
          echo "nuget-package-ci: building ${candidates[0]}" >> "${GITHUB_STEP_SUMMARY}"
      # Resolve the commit THIS workflow file was called at (see "Runtime
      # contract" in the header) and check the library out at it.
      - name: Resolve hashira's own commit
        id: self
        shell: bash
        env:
          # The called workflow file's commit, never the caller's.
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::nuget-package-ci: job.workflow_sha is '${WORKFLOW_SHA}', not a 40-character commit SHA, so hashira's composite actions cannot be checked out at the commit this workflow was called at (GitHub Enterprise Server does not provide job.workflow_sha)."
            exit 1
          fi
          echo "sha=${WORKFLOW_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Checkout hashira library at its own commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ steps.self.outputs.sha }}
          path: .hashira
          # Only .github/ (plus root files such as package.json, in cone mode): the actions
          # need nothing else, and a consumer's bare `node --test` must not discover and
          # run hashira's own tests out of .hashira/.
          sparse-checkout: .github
          persist-credentials: false
      - name: Confirm the checked-out library commit
        id: library
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.self.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git -C .hashira rev-parse HEAD)"
          if [[ "${actual}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::nuget-package-ci: .hashira is at ${actual}, expected ${EXPECTED_SHA}."
            exit 1
          fi
          echo "sha=${actual}" >> "${GITHUB_OUTPUT}"
          echo "nuget-package-ci: hashira composite actions checked out at ${actual}" >> "${GITHUB_STEP_SUMMARY}"

  # Resolves + stamps the release version (D1/D8). Gated at the JOB level on
  # a non-empty bump so a routine PR/push CI run (no bump) skips this
  # job entirely — no resolver invocation, no checkout-with-full-tags, no
  # pack/stamp work — and shows as "skipped" rather than running pointless
  # steps behind a step-level `if:`. Needs only `setup`, for the library
  # commit it checks out; independent of `restore-build`/`test`/
  # `scan-suite`: nothing here gates them and nothing here is gated by
  # them, so existing CI behavior for non-release runs is unaffected by
  # this job's presence. Mirrors `npm-package-ci.yml`'s `version` job.
  version:
    name: version
    needs: setup
    # A `with: bump` wins; otherwise the caller's workflow_dispatch input.
    # 'none' is the templates' "no release" choice (a choice input may not hold an empty
    # option, which actionlint refuses), so it gates like an empty bump.
    if: ${{ (inputs.bump || github.event.inputs.bump) != '' && (inputs.bump || github.event.inputs.bump) != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      resolved_version: ${{ steps.resolve.outputs.version }}
    steps:
      # actions/checkout v7.0.1 — consumer's tree. Full history + tags
      # (fetch-depth: 0, fetch-tags: true) so the resolver can see the real
      # tag list via `git tag --list` below; the other jobs' shallow
      # checkout is intentionally left as-is (they don't need tag history).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      # Library self-checkout at this workflow's own commit (see header).
      - name: Checkout hashira library at its own commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ needs.setup.outputs.library_sha }}
          path: .hashira
          # Only .github/ (plus root files such as package.json, in cone mode): the actions
          # need nothing else, and a consumer's bare `node --test` must not discover and
          # run hashira's own tests out of .hashira/.
          sparse-checkout: .github
          persist-credentials: false
      # actions/setup-dotnet v6.1.0 — needed for `dotnet pack` below.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      # actions/setup-node v7.1.0 — version-resolver's shim shells out to
      # `node` (D8's resolver action; same precedent as npm-package-ci.yml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
      - name: Gather tag list
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          # Newline-separated tag list, the shape version-resolver expects
          # (security.md B7: passed via env below, never interpolated into
          # a `run:` string by the resolver itself).
          tag_list="$(git tag --list)"
          {
            echo "tags<<HASHIRA_TAGS_EOF"
            echo "${tag_list}"
            echo "HASHIRA_TAGS_EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Resolve next version
        id: resolve
        uses: ./.hashira/.github/actions/version-resolver
        with:
          tags: ${{ steps.tags.outputs.tags }}
          # An explicit `with:` value wins over the caller's dispatch input.
          bump: ${{ inputs.bump || github.event.inputs.bump }}
          seed_version: ${{ inputs.seed_version || github.event.inputs.seed_version }}
      - name: Surface resolved version in run summary (NFR-DX-3)
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
          BUMP: ${{ inputs.bump || github.event.inputs.bump }}
        run: |
          set -euo pipefail
          echo "nuget-package-ci: resolved version ${RESOLVED_VERSION} (bump=${BUMP})" >> "${GITHUB_STEP_SUMMARY}"
      - name: Snapshot working tree into isolated pack staging dir (D1 — stamp-only, no commit-back)
        shell: bash
        run: |
          set -euo pipefail
          # Pack from an ISOLATED COPY of the working tree, never the
          # checked-out tree itself. This is the mechanism that makes the
          # "no commit-back" invariant (D1) true by construction rather than
          # by discipline: the consumer's project file in $GITHUB_WORKSPACE
          # is never opened for writing — MinVerVersionOverride below tells
          # MinVer what version to stamp; nothing rewrites the .csproj.
          #
          # `.hashira` is the D14 library self-checkout for THIS job, not
          # part of the consumer's package — excluded so the hashira library
          # source can never end up inside the packed .nupkg (mirrors
          # npm-package-ci.yml iteration 2.2 pass-1 review Major #2; `dotnet
          # pack`'s default file selection is "everything under the project
          # directory the SDK considers part of the project," which is a
          # different rule than npm's `.npmignore`/`files` allowlist, so the
          # exclude has to happen here, before pack ever runs, not be left to
          # dotnet's own file-selection rules).
          #
          # IMPORTANT: `.git` is excluded too, which means MinVer has ZERO
          # git tag history available inside this staged copy — its
          # tag-inference fallback is structurally unreachable here, not
          # just "overridden by preference." `version_override` (below) is
          # therefore the ONLY viable version source on this path; an empty
          # override would not fall back to a real tag-inferred guess, it
          # would fall back to MinVer's own no-history default (0.0.0-*).
          # This job only ever runs with a non-empty override (gated on
          # `bump != ''`, which always resolves a version first), so this is
          # not a live risk today — but a future caller of
          # `dotnet-pack-version` from a similarly `.git`-less tree (e.g. a
          # consumer composing it directly per D10) must pass an explicit
          # `version_override`; it cannot rely on tag-inference as a
          # fallback (pass-1 review, iteration 2.3, Major — verification
          # rigor; see diary).
          pack_dir="${RUNNER_TEMP}/hashira-pack"
          rm -rf "${pack_dir}"
          mkdir -p "${pack_dir}"
          rsync -a --exclude='.git' --exclude='.hashira' --exclude="${pack_dir}" ./ "${pack_dir}/"
      - name: Pack with stamped version via dotnet-pack-version (D1 — stamp-only, no commit-back)
        id: pack
        uses: ./.hashira/.github/actions/dotnet-pack-version
        with:
          working_directory: ${{ runner.temp }}/hashira-pack
          project_path: ${{ needs.setup.outputs.project_path }}
          output_directory: ${{ runner.temp }}/hashira-pack-output
          # The resolver's two-checkpoint-validated scalar wins over MinVer's
          # tag inference (phase 2.3's MinVer-stamping decision). MinVer is
          # RETAINED — packing still goes through ordinary `dotnet pack`;
          # only the version source changes from "infer from tags" to
          # "explicit, dispatch-resolved."
          version_override: ${{ steps.resolve.outputs.version }}
      - name: Assert packed version matches the resolved version
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
          PACKED_VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          # dotnet-pack-version's own `version` output is parsed straight
          # from the produced .nupkg's filename (mechanical, not MinVer's
          # log output) — comparing it to the resolver's output is an
          # end-to-end proof that `version_override` actually reached the
          # packed artifact, not just that the input was passed.
          if [ "${PACKED_VERSION}" != "${RESOLVED_VERSION}" ]; then
            echo "::error::nuget-package-ci: packed .nupkg version '${PACKED_VERSION}' does not match resolved version '${RESOLVED_VERSION}' — MinVerVersionOverride did not win over tag inference" >&2
            exit 1
          fi
          echo "nuget-package-ci: packed .nupkg version ${PACKED_VERSION} matches resolved version" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload packed .nupkg (same-run CI->CD artifact handoff)
        # actions/upload-artifact v7.0.2 — same pin already verified and in
        # use at .github/actions/coverage-report/action.yml and
        # npm-package-ci.yml's iter-2.2 `version` job; reused here rather
        # than introducing a new pin to the verified-pin set.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          # Stable, documented name: Phase 3's CD job downloads this exact
          # name to publish "the same-run artifact" (sdd.md §8's open item).
          # Re-packing in the CD job instead of downloading this artifact is
          # explicitly forbidden by phases/03-cd-composite-normalization.md
          # — it would silently break the byte-identical guarantee
          # NFR-Rel-1 requires.
          name: nuget-package
          path: ${{ runner.temp }}/hashira-pack-output/*.nupkg
          if-no-files-found: error
          # Same 5-day rationale as npm-package-ci.yml iteration 2.2: covers
          # the gap between "CI cuts a release" and "a maintainer
          # triggers/approves the CD publish job" (FR-8) without keeping
          # stale release artifacts around indefinitely.
          retention-days: 5
      - name: Assert stamp did not touch the checked-out working tree
        shell: bash
        run: |
          set -euo pipefail
          # D1's stamp-only / no-commit-back invariant: every write above
          # landed only inside $RUNNER_TEMP (outside $GITHUB_WORKSPACE).
          # This assertion proves it rather than just asserting it by
          # convention.
          #
          # `--untracked-files=no` is deliberate (npm-package-ci.yml
          # iteration 2.2 pass-1 review, Blocker): the D14 library
          # self-checkout above lands `.hashira/` as UNTRACKED content in
          # $GITHUB_WORKSPACE, and nothing gitignores it. Bare `git status
          # --porcelain` reports untracked files too, so without this flag
          # the assertion would fire on every real release, not just one
          # where the working tree was actually modified. The iteration's
          # own acceptance criterion is "no TRACKED-file diff outside the
          # artifact output path" (phases/02-version-resolver.md) — scoping
          # to tracked content is what D1 actually requires; it still
          # catches any modification to a tracked file (the real
          # invariant), it just stops flagging the expected, harmless
          # `.hashira/` self-checkout dir as a violation.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::nuget-package-ci: working tree changed during version/pack steps — stamp must only touch the packed output, never the checked-out tree" >&2
            git status --porcelain --untracked-files=no >&2
            exit 1
          fi
          echo "nuget-package-ci: git status (tracked files) clean after stamp — no commit-back occurred" >> "${GITHUB_STEP_SUMMARY}"

  restore-build:
    name: restore-build
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1 — consumer's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-dotnet v6.1.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      - name: Restore + build
        shell: bash
        env:
          NC_PROJECT_PATH: ${{ needs.setup.outputs.project_path }}
        run: |
          set -euo pipefail
          # Quoting via env var per the iter-2.1/2.3 trust-boundary pattern.
          dotnet restore "${NC_PROJECT_PATH}"
          dotnet build "${NC_PROJECT_PATH}" --configuration Release --no-restore

  test:
    name: test
    # Depends on restore-build as a fail-fast gate: if compile is broken,
    # we want to surface that BEFORE spinning up the test runner. Tests
    # re-run `dotnet restore` + build implicitly (no `--no-build` flag)
    # because GitHub Actions jobs don't share a filesystem and we
    # deliberately avoid `actions/upload-artifact` + `download-artifact`
    # cross-job handoff here (would add a new third-party SHA pin
    # outside this iteration's verified-pin set; see diary note from
    # iter 3.2). Cost: ~one extra restore+build per CI run. Acceptable
    # at v1; revisit if NuGet consumers' build times grow painful.
    # Asymmetric vs npm flow (which runs lint ∥ test ∥ scan-suite).
    # `setup` is listed too because this job reads its library_sha output.
    needs: [setup, restore-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Coverage totals for the CI summary comment the passed job writes.
      lines_pct: ${{ steps.coverage.outputs.lines_pct }}
      branches_pct: ${{ steps.coverage.outputs.branches_pct }}
      # '0' when the report measured no file: the comment then says so
      # instead of showing 0.0% as if it were a measurement.
      coverage_files: ${{ steps.coverage.outputs.files }}
    steps:
      # actions/checkout v7.0.1 — consumer's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-dotnet v6.1.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      # Library self-checkout at this workflow's own commit (see header).
      - name: Checkout hashira library at its own commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ needs.setup.outputs.library_sha }}
          path: .hashira
          # Only .github/ (plus root files such as package.json, in cone mode): the actions
          # need nothing else, and a consumer's bare `node --test` must not discover and
          # run hashira's own tests out of .hashira/.
          sparse-checkout: .github
          persist-credentials: false
      - name: Run tests
        uses: ./.hashira/.github/actions/run-tests-dotnet
        with:
          # Build the dotnet test command at this layer so test_filter can
          # be omitted cleanly when empty (avoids a stray `--filter ''`
          # that the dotnet CLI rejects on some 8.0.x patch versions).
          #
          # Iter-3.2 review Minor #2: the filter value is wrapped in SINGLE
          # quotes (`--filter '{1}'`) rather than double quotes. xUnit /
          # MSTest filter expressions commonly carry literal `"` around
          # property values (`Category="Integration"`, `FullyQualifiedName!="X"`)
          # but do NOT use single quotes — single-quote wrapping is the
          # safer envelope. project_path is a path; single quotes around it
          # are also safe (paths don't contain `'` on any realistic .NET
          # repo layout, and the trust-boundary block forbids deriving
          # project_path from externally-controlled context anyway).
          command: ${{ inputs.test_filter == '' && format('dotnet test ''{0}'' --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults', needs.setup.outputs.project_path) || format('dotnet test ''{0}'' --configuration Release --filter ''{1}'' --collect:"XPlat Code Coverage" --results-directory TestResults', needs.setup.outputs.project_path, inputs.test_filter) }}
          coverage_path: ${{ inputs.coverage_path || 'coverage/cobertura.xml' }}
          results_directory: TestResults
      # actions/setup-node v7.1.0 — coverage-report's parser shim needs a
      # `node` binary on PATH. ubuntu-latest ships one, but pin it explicitly
      # so the dependency is visible (mirrors _self-ci.yml's actions-smoke job).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
      # Report coverage IN THIS JOB: run-tests-dotnet just standardized the
      # cobertura file at `coverage_path` in this workspace, so it is present
      # here. (The former separate coverage-report job ran on a fresh runner
      # with no artifact handoff and always failed "file not found".)
      # No coverage comment here: the totals go to the passed job's one CI
      # summary comment, and the per-file table stays in this job's summary.
      - name: Report coverage
        id: coverage
        uses: ./.hashira/.github/actions/coverage-report
        with:
          coverage_path: ${{ inputs.coverage_path || 'coverage/cobertura.xml' }}
          comment: 'false'

  scan-suite:
    name: scan-suite
    # Parallel with restore-build/test (does not need build outputs).
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeQL needs security-events:write when enabled; granted here
      # even when codeql is in the default skip list so consumers who
      # enable it via scan_disable: '' don't hit a permissions error.
      security-events: write
      # dependency-review on PR events reads PR metadata.
      pull-requests: read
    outputs:
      # One '<name>\t<pass|fail|skipped>' line per scanner, for the CI
      # summary comment.
      verdicts: ${{ steps.scan.outputs.verdicts }}
      # The '<name>\t<status>\t<details>' rows, so the comment can say why a
      # scanner was skipped or failed.
      scan_summary: ${{ steps.scan.outputs.summary }}
    steps:
      # actions/checkout v7.0.1 — consumer's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Library self-checkout at this workflow's own commit (see header).
      - name: Checkout hashira library at its own commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ needs.setup.outputs.library_sha }}
          path: .hashira
          # Only .github/ (plus root files such as package.json, in cone mode): the actions
          # need nothing else, and a consumer's bare `node --test` must not discover and
          # run hashira's own tests out of .hashira/.
          sparse-checkout: .github
          persist-credentials: false
      - name: Run scan-suite
        id: scan
        uses: ./.hashira/.github/actions/scan-suite
        with:
          scan_disable: ${{ inputs.scan_disable }}
          # Findings or a scanner error fail this job; a consumer who can't
          # act on one scanner's findings turns it off with scan_disable.
          fail_on_findings: ${{ inputs.scan_fail_on_findings && 'true' || 'false' }}

  # SoMi's quality check on what a pull request changes. On by default;
  # `quality_gate: false` skips this job. On push and workflow_dispatch the
  # action passes and writes "skipped: quality gate runs on pull requests".
  quality-gate:
    name: quality-gate
    needs: setup
    if: ${{ inputs.quality_gate }}
    runs-on: ubuntu-latest
    permissions:
      # Read the consumer's tree. Violations go to the job summary and to
      # annotations, which need no grant.
      contents: read
    outputs:
      # The gate's result and violation count, for the CI summary comment.
      result: ${{ steps.gate.outputs.result }}
      violations: ${{ steps.gate.outputs.violations }}
    steps:
      # actions/checkout v7.0.1 — consumer's tree. Full history so the pull
      # request's base commit is present without a credentialed fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.1.0 — the gate installs and runs SoMi with
      # npm/node. This flow has no node_version input, so it pins Node 20
      # like its other node steps.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
      # Library self-checkout at this workflow's own commit (see header).
      - name: Checkout hashira library at its own commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ needs.setup.outputs.library_sha }}
          path: .hashira
          # Only .github/ (plus root files such as package.json, in cone mode): the actions
          # need nothing else, and a consumer's bare `node --test` must not discover and
          # run hashira's own tests out of .hashira/.
          sparse-checkout: .github
          persist-credentials: false
      - name: Run the SoMi quality gate
        id: gate
        uses: ./.hashira/.github/actions/quality-gate
        with:
          level: ${{ inputs.quality_level }}

  # The one stable check for every repo type. Called as job `ci`, this job
  # reports as `ci / passed`, the check a branch ruleset requires. It runs
  # with always(), so it reports even when setup fails or the run is
  # cancelled, and it fails unless every needed job succeeded or was skipped
  # by a documented input (see ci-summary's lib/verdict.js). On
  # pull_request events it also keeps the one hashira summary comment on
  # the pull request.
  passed:
    name: passed
    needs: [setup, version, restore-build, test, scan-suite, quality-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # A hung comment API call must not hold the required check open for the
    # runner's six-hour default. ci-summary runs on the runner's own node, so
    # the job needs no setup-node download either.
    timeout-minutes: 10
    permissions:
      # Check out hashira's ci-summary action.
      contents: read
      # Write, and edit in place, the one CI summary comment on the pull
      # request. No other job in this workflow holds this grant.
      pull-requests: write
    steps:
      # Resolve hashira's own commit here rather than read it from setup, so
      # this job still reports when setup failed (see "Runtime contract" in
      # the header).
      - name: Resolve hashira's own commit
        id: self
        shell: bash
        env:
          # The called workflow file's commit, never the caller's.
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::nuget-package-ci: job.workflow_sha is '${WORKFLOW_SHA}', not a 40-character commit SHA, so hashira's ci-summary action cannot be checked out."
            exit 1
          fi
          echo "sha=${WORKFLOW_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Checkout hashira library at its own commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ steps.self.outputs.sha }}
          path: .hashira
          # Only .github/ (plus root files such as package.json, in cone mode): the actions
          # need nothing else, and a consumer's bare `node --test` must not discover and
          # run hashira's own tests out of .hashira/.
          sparse-checkout: .github
          persist-credentials: false
      - name: Judge the jobs and write the CI summary
        uses: ./.hashira/.github/actions/ci-summary
        with:
          needs: ${{ toJSON(needs) }}
          workflow_inputs: ${{ toJSON(inputs) }}
          comment: ${{ inputs.summary_comment && 'true' || 'false' }}
