# Reusable workflow: static-webapp-ci (CI half of the static-webapp flow per
# D8; Pages-specific CI→Deploy handoff per D12).
#
# Runs build + test + scan-suite + coverage-report and uploads the
# `github-pages` artifact in the SAME job as build (see "Build artifact
# handoff" below). The Deploy half is the `pages-deploy` composite action and
# consumes the same-run artifact via the consumer's `deploy: needs: ci`
# edge (D12) — no `workflow_run` trigger, no cross-run artifact lookup.
#
# ## Permissions baseline (NF6)
#
# Workflow-level `permissions: {}` (deny-all). Each job grants the minimum
# it needs:
#   - setup           : contents:read
#   - build-and-upload: contents:read, id-token:write, pages:write
#                       (id-token + pages required by upload-pages-artifact;
#                       see `.github/actions/pages-upload/action.yml` header)
#   - test            : contents:read (coverage-report runs as the last
#                       step of this job — see "Coverage report handoff")
#   - scan-suite      : contents:read, security-events:write (CodeQL),
#                       pull-requests:read (dependency-review on PR)
#   - quality-gate    : contents:read
#   - passed          : contents:read, pull-requests:write (the one CI
#                       summary comment on the pull request; the only job
#                       with this grant)
#
# Reusable workflows can only NARROW the caller's grants, never broaden.
# Consumers must mirror this matrix at their caller job's `permissions:`
# block (documented in `docs/usage.md` and `docs/flows/static-webapp.md`).
#
# ## Build artifact handoff (build-and-upload collapse)
#
# `actions/upload-pages-artifact` packages a local directory; it cannot
# reach across GHA jobs to pick up files produced by a prior job's
# `build_command`. Two options exist:
#   (a) Run `build_command` in one job, upload the output via
#       `actions/upload-artifact`, then download it in a second job and
#       feed it to `upload-pages-artifact`.
#   (b) Collapse `build` and `pages-upload` into a single job so the
#       build output is on the same runner filesystem when upload runs.
#
# We choose (b). Rationale:
#   - Saves one third-party SHA pin (`actions/upload-artifact`) outside
#     this iteration's verified-pin set (same trade-off documented in
#     `nuget-package-ci.yml` for the restore-build/test relationship).
#   - Eliminates a class of "wrong directory packaged" failure modes
#     that the cross-job handoff would introduce (upload-artifact's
#     `path:` and download-artifact's destination would have to agree
#     with `pages-upload`'s `path:` input — three places to keep in sync
#     versus zero).
#   - The `test` and `scan-suite` jobs run in parallel with
#     `build-and-upload`, so the collapse does NOT add wall-clock
#     latency — total CI time is `max(build+upload, test, scan-suite)`
#     either way.
#
# Trade-off: the `build-and-upload` job is slightly less symmetric with
# the rest of the library's per-step job decomposition (npm/NuGet flows
# have separate `lint`/`test` jobs that don't fuse anything). Acceptable
# because the fusion is forced by the upload primitive's locality
# requirement, not by a discretionary design choice.
#
# ## Coverage report handoff (test/coverage-report collapse)
#
# `coverage-report` used to be its own job, `needs: [build-and-upload, test,
# scan-suite]`, checking out the consumer's tree fresh on its own runner. It
# always failed "file not found": `run-tests-js` (in the `test` job) writes
# the coverage file into THAT job's own workspace, which does not exist on
# `coverage-report`'s separate runner — no artifact handoff connected them.
# Found live against a real consumer (Hinokami) once the two bugs upstream
# of it were fixed and CI finally ran this job for the first time. Same
# class of bug npm-package-ci.yml's and nuget-package-ci.yml's `test` jobs
# already fixed by running coverage-report as their own last step — this
# workflow was never migrated to match. Fixed the same way: run "Report
# coverage" as the last step of `test` (same job, same workspace, same
# `.hashira/` checkout already there for `run-tests-js`) and remove the
# separate job, rather than wire up `upload-artifact`/`download-artifact`
# (an extra SHA pin plus a `path:` to keep in sync in three places — the
# same trade-off already made for the build-and-upload collapse above).
#
# ## Trust boundary
#
# These workflow inputs flow into composite-action inputs and/or shell
# command lines downstream (`run` blocks below, `pages-upload`'s `path`,
# `scan-suite`'s `scan_disable`, `coverage-report`'s `coverage_path`).
# Per D10d this is permitted but requires documented conventions: treat
# the values as TRUSTED input. Do NOT pass values derived from PR
# titles, issue bodies, branch names, commit messages,
# fork-author-controlled tag names, or any other externally controlled
# context — quoting cannot defend the downstream sinks.
#   - node_version
#   - build_command
#   - output_dir
#   - test_command
#   - coverage_path
#   - scan_disable
#
# iter-4.2 security review m4: because `build_command` runs in the same
# job that holds `id-token: write`, a consumer who violates this trust
# contract can have their GitHub OIDC token exfiltrated by attacker-
# controlled code; any cloud federation configured against this repo's
# OIDC subject is in the blast radius. See `## Build artifact handoff`
# for why the architectural split into a separate non-`id-token` build
# job is not feasible without a new cross-job artifact handoff (forced
# by `upload-pages-artifact`'s same-runner locality requirement).
#
# ## `pull_request_target` is forbidden (B8, iter 3.3)
#
# Consumers calling this reusable workflow MUST trigger it via
# `pull_request`, and MUST NOT use `pull_request_target`. This is the
# canonical privilege-escalation pattern (B8/AP7, `security.md` §1/§6):
# `pull_request_target` runs in the BASE repo's context — with the base
# repo's secrets and a token scoped to the base repo — even for a
# fork-originated PR, so a fork PR author's `build_command`/
# `test_command` (both raw-shell sinks per D10d above) would execute
# with that elevated context instead of the fork's own restricted
# token. This workflow's `build-and-upload` job already holds
# `id-token: write` (see the permissions baseline above); combining that
# grant with `pull_request_target`'s base-repo context on every fork PR
# is exactly the escalation B8 exists to prevent. Use `pull_request`
# (read-only fork token, no secrets) for PR-triggered CI; never switch
# to `pull_request_target` to work around the read-only token's
# limitations — that "fix" is the footgun, not a solution.
#
# See `docs/usage.md` for the full trust model.
#
# ## SHA pins (NF2)
#
# All third-party `uses:` refs are pinned to a full 40-char commit SHA
# with an inline version comment. Pins reused from iter 1.2 / 2.1 / 2.2
# (verified upstream against the actions' release tags).
#
# ## Runtime contract: library self-checkout at the workflow's own commit
#
# In-repo composite actions live at `.github/actions/<name>` in
# `skathio/hashira`. A consumer's `$GITHUB_WORKSPACE` holds the consumer's
# files, not the library's, and GitHub's `uses:` keyword does not accept
# expressions in its `@<ref>` portion. So every job that runs one of these
# actions first checks out `skathio/hashira` into the reserved
# subdirectory `.hashira/` (`persist-credentials: false`) and then calls it
# by the literal local path `uses: ./.hashira/.github/actions/<name>`.
#
# The checkout's ref is the commit this workflow file was itself called
# at, so a caller pinned at `@<sha>` or `@v3` runs composite actions from
# that same commit and has no second ref to keep in sync. The `setup` job
# reads it from `job.workflow_sha`, which GitHub documents as the commit of
# the workflow file that defines the current job: for a reusable workflow,
# the called file, not the caller. `github.sha` and `github.workflow_sha`
# name the caller's commit and must never be used for this checkout.
# `setup` fails when the value is not a 40-character SHA (GitHub
# Enterprise Server does not provide `job.workflow_sha`), checks the
# library out at it, and publishes the commit it actually checked out as
# its `library_sha` output. Every other job checks out
# `needs.setup.outputs.library_sha`, and the workflow exposes the same
# value as its `library_sha` output.
#
# Trade-off: ~1–2s overhead per job for the library checkout, the cost of
# the literal-`uses:` constraint.

name: static-webapp-ci

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node major to install via actions/setup-node. Default '20'. Trusted input."
        required: false
        type: string
        default: "20"
      build_command:
        description: "Shell command that builds the static site. Default 'npm run build'. Trusted input (raw-shell sink per D10d; do NOT pass values derived from PR titles, issue bodies, branch names, or other externally controlled context)."
        required: false
        type: string
        default: "npm run build"
      output_dir:
        description: "Directory containing the built static site (passed through to pages-upload's `path` input). Empty (default) triggers pages-upload's autodetect among `dist/`, `build/`, `out/`, `public/` (first-found wins). Trusted input."
        required: false
        type: string
        default: ""
      test_command:
        description: "Shell command that runs the consumer's tests. Default 'npm test'. Trusted input: it runs as raw shell, so do NOT pass values derived from PR titles, issue bodies, branch names, or other externally controlled context."
        required: false
        type: string
        default: "npm test"
      coverage_path:
        description: "Path to the coverage file the tests write. Empty (default) uses the flow's standard path: 'coverage/lcov.info' for npm and static-webapp, 'coverage/cobertura.xml' for NuGet. Trusted input."
        required: false
        type: string
        default: ""
      scan_disable:
        description: "Comma-separated list of scans to skip (D10c). Default 'codeql,actionlint' — pass '' to enable all. Values: codeql,osv,gitleaks,dependency-review,actionlint."
        required: false
        type: string
        default: "codeql,actionlint"
      scan_fail_on_findings:
        description: "Fail the scan-suite job, and so the ci / passed check, when a scanner reports findings or an error. Default true. false keeps every enabled scanner running and reported as fail in the job summary and the CI summary comment, without failing the job. A scanner turned off with scan_disable does not run at all."
        required: false
        type: boolean
        default: true
      quality_gate:
        description: "Run SoMi's quality gate on what a pull request changes. Default true; false skips the quality-gate job. The gate runs only on pull_request events; on other events it passes and says so in the job summary."
        required: false
        type: boolean
        default: true
      quality_level:
        description: "SoMi quality level for the gate: exactly 'strict' (default), 'standard' or 'relaxed'. Any other value, including '', fails the setup job."
        required: false
        type: string
        default: "strict"
    outputs:
      library_sha:
        description: "The skathio/hashira commit this run checked its composite actions out at: the commit this workflow file was called at."
        value: ${{ jobs.setup.outputs.library_sha }}

# Deny-all baseline; jobs grant the minimum.
permissions: {}

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The hashira commit every job checks out into .hashira/.
      library_sha: ${{ steps.library.outputs.sha }}
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      # persist-credentials:false per iter-4.2 review Minor #2 (defense-in-depth:
      # build_command / test_command run in these jobs and the default git
      # credential could be exfiltrated if the trust contract is violated).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node_version }}
      - name: Input preflight (no-op for CI half)
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node_version }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          set -euo pipefail
          # CI half requires no secrets (static webapps build from public
          # source). The preflight pattern is documented here for symmetry
          # with the Deploy half which validates environment_name per
          # spec §8. We do emit a summary line naming the resolved inputs
          # so the consumer can verify their wiring at a glance.
          echo "static-webapp-ci: node_version='${NODE_VERSION}' build_command='${BUILD_COMMAND}' output_dir='${OUTPUT_DIR:-<autodetect>}'" >> "${GITHUB_STEP_SUMMARY}"
      # A misconfigured level fails here, visibly, even when the gate is off.
      - name: Validate quality_level
        shell: bash
        env:
          QUALITY_LEVEL: ${{ inputs.quality_level }}
        run: |
          set -euo pipefail
          case "${QUALITY_LEVEL}" in
            strict|standard|relaxed) ;;
            *)
              echo "::error::static-webapp-ci: quality_level must be exactly 'strict', 'standard' or 'relaxed', got ${QUALITY_LEVEL@Q}."
              exit 1
              ;;
          esac
      # Resolve the commit THIS workflow file was called at (see "Runtime
      # contract" in the header) and check the library out at it.
      - name: Resolve hashira's own commit
        id: self
        shell: bash
        env:
          # The called workflow file's commit, never the caller's.
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::static-webapp-ci: job.workflow_sha is '${WORKFLOW_SHA}', not a 40-character commit SHA, so hashira's composite actions cannot be checked out at the commit this workflow was called at (GitHub Enterprise Server does not provide job.workflow_sha)."
            exit 1
          fi
          echo "sha=${WORKFLOW_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Checkout hashira library at its own commit
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ steps.self.outputs.sha }}
          path: .hashira
          persist-credentials: false
      - name: Confirm the checked-out library commit
        id: library
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.self.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git -C .hashira rev-parse HEAD)"
          if [[ "${actual}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::static-webapp-ci: .hashira is at ${actual}, expected ${EXPECTED_SHA}."
            exit 1
          fi
          echo "sha=${actual}" >> "${GITHUB_OUTPUT}"
          echo "static-webapp-ci: hashira composite actions checked out at ${actual}" >> "${GITHUB_STEP_SUMMARY}"

  build-and-upload:
    name: build-and-upload
    needs: setup
    runs-on: ubuntu-latest
    # build_command runs in the consumer's tree, then pages-upload packages
    # the result. Both steps must execute on the same runner (see "Build
    # artifact handoff" in the workflow header for the rationale).
    permissions:
      contents: read
      # id-token + pages required by upload-pages-artifact (see
      # `.github/actions/pages-upload/action.yml` header `## Required
      # caller permissions` block).
      id-token: write
      pages: write
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      # persist-credentials:false per iter-4.2 review Minor #2 (defense-in-depth:
      # build_command / test_command run in these jobs and the default git
      # credential could be exfiltrated if the trust contract is violated).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node_version }}
      # Library self-checkout at this workflow's own commit (see header).
      - name: Checkout hashira library at its own commit
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ needs.setup.outputs.library_sha }}
          path: .hashira
          persist-credentials: false
      - name: Install dependencies
        # Found via a real consumer's first live PR against this flow (v2 —
        # neither this job nor `test` ever installed the consumer's own
        # devDependencies before running `build_command`/`test_command`;
        # every consumer hit a bare `npm run build`/`npm test` against an
        # empty node_modules). `docs/flows/static-webapp.md §8` used to tell
        # consumers to work around this by folding `npm install` into their
        # own `build_command` — that advice is now obsolete and removed;
        # fixing it here closes the gap for every consumer instead of
        # relying on each one remembering the workaround (this job's own
        # first real consumer didn't). `npm ci` (not `npm install`) for
        # lockfile-respecting, reproducible CI installs — the same
        # convention `_self-ci.yml` already uses elsewhere in this repo.
        shell: bash
        run: npm ci
      - name: Build static site
        shell: bash
        env:
          # Bind via env per the iter-2.1/2.3 trust-boundary pattern. The
          # value is then dereferenced with `eval` because build_command
          # is intentionally a raw-shell sink (D10d) — the consumer may
          # legitimately need `&&`, env-var expansion, or pipes inside
          # the command. The trust-boundary block at the top of the file
          # forbids deriving this from externally controlled context.
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -euo pipefail
          # Echo the command for log triage, then run it via the shell so
          # consumer-supplied composite shell forms (`&&`, pipes, env
          # expansion) work as expected. This matches the run-tests-js
          # pattern established in iter 1.2.
          echo "static-webapp-ci/build-and-upload: running build_command"
          eval "${BUILD_COMMAND}"
      - name: Upload Pages artifact
        uses: ./.hashira/.github/actions/pages-upload
        with:
          path: ${{ inputs.output_dir }}

  test:
    name: test
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Coverage totals for the CI summary comment the passed job writes.
      lines_pct: ${{ steps.coverage.outputs.lines_pct }}
      branches_pct: ${{ steps.coverage.outputs.branches_pct }}
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      # persist-credentials:false per iter-4.2 review Minor #2 (defense-in-depth:
      # build_command / test_command run in these jobs and the default git
      # credential could be exfiltrated if the trust contract is violated).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node_version }}
      # Library self-checkout at this workflow's own commit (see header).
      - name: Checkout hashira library at its own commit
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ needs.setup.outputs.library_sha }}
          path: .hashira
          persist-credentials: false
      # See the identical step + comment in build-and-upload above — same
      # bug, same fix, this job's half of it (test_command has no
      # documented consumer-side workaround at all, unlike build_command's
      # now-removed one, so this half was unconditionally broken).
      - name: Install dependencies
        shell: bash
        run: npm ci
      - name: Run tests
        uses: ./.hashira/.github/actions/run-tests-js
        with:
          command: ${{ inputs.test_command }}
          coverage_path: ${{ inputs.coverage_path || 'coverage/lcov.info' }}
      # Report coverage IN THIS JOB — see "Coverage report handoff" above.
      # run-tests-js just standardized the coverage file at `coverage_path`
      # in this workspace, so it is present here.
      # No coverage comment here: the totals go to the passed job's one CI
      # summary comment, and the per-file table stays in this job's summary.
      - name: Report coverage
        id: coverage
        uses: ./.hashira/.github/actions/coverage-report
        with:
          coverage_path: ${{ inputs.coverage_path || 'coverage/lcov.info' }}
          comment: 'false'

  scan-suite:
    name: scan-suite
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeQL needs security-events:write when enabled; granted here
      # even when codeql is in the default skip list so consumers who
      # enable it via scan_disable: '' don't hit a permissions error.
      security-events: write
      # dependency-review on PR events reads PR metadata.
      pull-requests: read
    outputs:
      # One '<name>\t<pass|fail|skipped>' line per scanner, for the CI
      # summary comment.
      verdicts: ${{ steps.scan.outputs.verdicts }}
    steps:
      # actions/checkout v4.2.2 — consumer's tree.
      # persist-credentials:false per iter-4.2 review Minor #2 (defense-in-depth:
      # build_command / test_command run in these jobs and the default git
      # credential could be exfiltrated if the trust contract is violated).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v4.1.0 — visibility-detect shim runs via `node`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node_version }}
      # Library self-checkout at this workflow's own commit (see header).
      - name: Checkout hashira library at its own commit
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ needs.setup.outputs.library_sha }}
          path: .hashira
          persist-credentials: false
      - name: Run scan-suite
        id: scan
        uses: ./.hashira/.github/actions/scan-suite
        with:
          scan_disable: ${{ inputs.scan_disable }}
          # Findings or a scanner error fail this job; a consumer who can't
          # act on one scanner's findings turns it off with scan_disable.
          fail_on_findings: ${{ inputs.scan_fail_on_findings && 'true' || 'false' }}

  # SoMi's quality check on what a pull request changes. On by default;
  # `quality_gate: false` skips this job. On push and workflow_dispatch the
  # action passes and writes "skipped: quality gate runs on pull requests".
  quality-gate:
    name: quality-gate
    needs: setup
    if: ${{ inputs.quality_gate }}
    runs-on: ubuntu-latest
    permissions:
      # Read the consumer's tree. Violations go to the job summary and to
      # annotations, which need no grant.
      contents: read
    outputs:
      # The gate's result and violation count, for the CI summary comment.
      result: ${{ steps.gate.outputs.result }}
      violations: ${{ steps.gate.outputs.violations }}
    steps:
      # actions/checkout v4.2.2 — consumer's tree. Full history so the pull
      # request's base commit is present without a credentialed fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v4.1.0 — the gate installs and runs SoMi with npm/node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node_version }}
      # Library self-checkout at this workflow's own commit (see header).
      - name: Checkout hashira library at its own commit
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ needs.setup.outputs.library_sha }}
          path: .hashira
          persist-credentials: false
      - name: Run the SoMi quality gate
        id: gate
        uses: ./.hashira/.github/actions/quality-gate
        with:
          level: ${{ inputs.quality_level }}

  # The one stable check for every repo type. Called as job `ci`, this job
  # reports as `ci / passed`, the check a branch ruleset requires. It runs
  # with always(), so it reports even when setup fails or the run is
  # cancelled, and it fails unless every needed job succeeded or was skipped
  # by a documented input (see ci-summary's lib/verdict.js). On
  # pull_request events it also keeps the one hashira summary comment on
  # the pull request.
  passed:
    name: passed
    needs: [setup, build-and-upload, test, scan-suite, quality-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # A hung comment API call must not hold the required check open for the
    # runner's six-hour default. ci-summary runs on the runner's own node, so
    # the job needs no setup-node download either.
    timeout-minutes: 10
    permissions:
      # Check out hashira's ci-summary action.
      contents: read
      # Write, and edit in place, the one CI summary comment on the pull
      # request. No other job in this workflow holds this grant.
      pull-requests: write
    steps:
      # Resolve hashira's own commit here rather than read it from setup, so
      # this job still reports when setup failed (see "Runtime contract" in
      # the header).
      - name: Resolve hashira's own commit
        id: self
        shell: bash
        env:
          # The called workflow file's commit, never the caller's.
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::static-webapp-ci: job.workflow_sha is '${WORKFLOW_SHA}', not a 40-character commit SHA, so hashira's ci-summary action cannot be checked out."
            exit 1
          fi
          echo "sha=${WORKFLOW_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Checkout hashira library at its own commit
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: skathio/hashira
          ref: ${{ steps.self.outputs.sha }}
          path: .hashira
          persist-credentials: false
      - name: Judge the jobs and write the CI summary
        uses: ./.hashira/.github/actions/ci-summary
        with:
          needs: ${{ toJSON(needs) }}
          workflow_inputs: ${{ toJSON(inputs) }}
