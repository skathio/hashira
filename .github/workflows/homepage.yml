# Asks the org homepage (skathio/skathio.github.io) to rebuild, so this project's tile shows a
# release or a manifest change within minutes instead of at the next scheduled build.
# The tile itself is described by .github/homepage.json; see the homepage repo's docs/manifest.md.
#
# Token: HOMEPAGE_DISPATCH_TOKEN, a fine-grained token limited to skathio/skathio.github.io with
# Contents read and write (what repository_dispatch requires). Keep it as a secret of the
# `homepage` environment, which only main can use, so a workflow pushed to any other branch or
# tag cannot read it. A release is picked up by the homepage's scheduled build, or at once by
# running this workflow by hand on main. When it is not set, the job notes that and succeeds, and the
# homepage catches up on its own schedule. A failed ping warns on the run instead of failing it.
name: homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/homepage.json'
      - 'site/mark.svg'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: homepage
    permissions: {}
    steps:
      - name: Ask the homepage to rebuild
        env:
          GH_TOKEN: ${{ secrets.HOMEPAGE_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: project-updated
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::HOMEPAGE_DISPATCH_TOKEN is not set; the homepage picks this up on its next scheduled build."
            exit 0
          fi
          # A ping is a courtesy, so a failure never fails the run, but it must be seen: an expired
          # or under-scoped token would otherwise leave the tile waiting for the scheduled build.
          if ! gh api repos/skathio/skathio.github.io/dispatches \
            -f "event_type=${EVENT}" -f "client_payload[repo]=${REPO}"; then
            echo "::warning title=Homepage ping failed::The homepage was not asked to rebuild. Check or rotate HOMEPAGE_DISPATCH_TOKEN (the 'homepage' environment secret); the tile catches up on the next scheduled build."
          fi
