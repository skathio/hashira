# Composite action: coverage-report
#
# Language-agnostic coverage surface per D5:
#   - parses lcov / cobertura / opencover with a Node stdlib-only shim
#     (no `npm install` mid-action)
#   - writes a 1-line summary + per-file table into $GITHUB_STEP_SUMMARY
#   - posts a sticky PR comment (only on pull_request events) via
#     actions/github-script (lighter than a third-party sticky-comment
#     action — one fewer pin to maintain)
#   - uploads the raw coverage file as a workflow artifact
#
# Per NF1: ≤ ~80 lines. The parsing logic lives in lib/parse-coverage.js
# and lib/render-summary.js so this action.yml stays orchestration-only.
#
# Requires: a `node` binary on PATH (>= 18 recommended; the shim itself
# only uses node:fs/node:path/node:os which work on >= 14). Caller
# workflows should run `actions/setup-node` before invoking this action
# when targeting a runner without preinstalled Node. The standard
# GitHub-hosted `ubuntu-latest` runner ships a recent Node so this works
# without explicit setup there, but self-hosted runners and future image
# changes are not guaranteed.
name: coverage-report
description: Parse a coverage report and surface it via PR comment + step summary + artifact.

inputs:
  coverage_path:
    description: "File path to the coverage report (lcov.info, cobertura.xml, opencover.xml)."
    required: true
  format:
    description: "Explicit format: 'lcov' | 'cobertura' | 'opencover'. Auto-detected from extension/content if omitted."
    required: false
    default: ""
  artifact_name:
    description: "Name of the workflow artifact to upload."
    required: false
    default: "coverage"
  artifact_retention_days:
    description: "Retention in days for the uploaded artifact."
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Parse coverage + write summary
      id: parse
      shell: bash
      env:
        COVERAGE_INPUT_PATH: ${{ inputs.coverage_path }}
        COVERAGE_INPUT_FORMAT: ${{ inputs.format }}
        COVERAGE_OUTPUT_FILE: ${{ runner.temp }}/coverage-comment.md
      run: |
        set -euo pipefail
        node "${GITHUB_ACTION_PATH}/lib/render-summary.js"
        echo "comment_file=${COVERAGE_OUTPUT_FILE}" >> "${GITHUB_OUTPUT}"

    - name: Post sticky PR comment
      if: ${{ github.event_name == 'pull_request' }}
      # actions/github-script v7.0.1
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- hashira:coverage-report -->';
          const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          if (!issue_number) {
            core.info('coverage-report: no PR number in context; skipping sticky comment.');
            return;
          }
          const existing = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const prior = existing.find(c => c.body && c.body.startsWith(marker));
          if (prior) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            core.info(`coverage-report: updated sticky comment ${prior.id}.`);
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info('coverage-report: created sticky comment.');
          }
      env:
        COMMENT_FILE: ${{ steps.parse.outputs.comment_file }}

    - name: Upload coverage artifact
      # actions/upload-artifact v4.4.3
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.coverage_path }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: error
