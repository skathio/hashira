# Composite action: scan-suite/scans/codeql
#
# Wraps github/codeql-action init + analyze. Visibility-adaptive per D7:
# on private repos without GHAS, emits a `::notice::` skip line and exits 0
# instead of failing. The `HASHIRA_FORCE_PRIVATE_NO_GHAS=1` env override
# forces this skip path for self-CI evidence on hashira-ops itself. That
# env name is reserved (HASHIRA_ namespace) — consumer workflows must not
# set it; see orchestrator `action.yml` header.
#
# Writes one TAB-separated line to `${RUNNER_TEMP}/scan-suite-results.tsv`:
#   codeql<TAB><status><TAB><details>
# where <status> is one of: ran | skipped | error.
#
# Per NF1: ≤ ~80 lines. Per NF2: third-party `uses:` pinned by SHA.
#
# ## Trust boundary
#
# The `languages` input is interpolated into a raw `printf` / `$GITHUB_STEP_SUMMARY`
# shell line in the `Record ran-status` step. Treat the value as trusted input —
# do not derive from PR titles, issue bodies, branch names, or other externally
# controlled context. Typical safe values are hard-coded language lists like
# `javascript,python`. See `docs/usage.md` (TBD — populated in phase 2) for the
# full trust model.
name: scan-suite/codeql
description: CodeQL static analysis (visibility-adaptive; skips on private without GHAS).

inputs:
  languages:
    description: "Comma-separated list of languages for CodeQL (e.g. 'javascript,python'). Empty = autodetect. Raw-shell-interpolated in the ran-status step — treat as trusted input; do not derive from externally controlled context (PR titles, issue bodies, branch names, etc.)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Detect visibility / GHAS
      id: detect
      shell: bash
      env:
        GH_CONTEXT: ${{ toJSON(github) }}
        HASHIRA_FORCE_PRIVATE_NO_GHAS: ${{ env.HASHIRA_FORCE_PRIVATE_NO_GHAS }}
      run: |
        set -euo pipefail
        # Found live (first real workflow_call of this action ever hit
        # "TypeError: detect is not a function"): GITHUB_ACTION_PATH for a
        # composite action nested two levels deep (orchestrator ->
        # scan-suite -> this action) does not reliably resolve to THIS
        # action's own directory on every runner version — the `../../`
        # climb from it lands somewhere that exists but isn't
        # lib/visibility-detect.js, so require() silently resolved to the
        # wrong module and `detect` was undefined. `.hashira` is always
        # checked out at the workspace root by the `library_ref` checkout
        # step in every caller job, at a fixed, known path regardless of
        # composite-nesting depth — anchor on GITHUB_WORKSPACE instead.
        #
        # Second occurrence of the same symptom, different cause: found live
        # against a real ESM consumer (`"type": "module"` in their
        # package.json). With no package.json inside `.hashira/`, Node's
        # CJS/ESM boundary walk for this require() continued past
        # `.hashira/` into the consumer's own workspace root and loaded this
        # file as an ES module — require() didn't throw, it just returned an
        # object with no `detect` export. Fixed by the root `package.json`
        # (`"type": "commonjs"`) added to this repo, which is always closer
        # to any file under `.hashira/` than a consumer's own root. Self-CI
        # never catches this class of bug: hashira has no package.json of
        # its own to trigger the misclassification when testing itself.
        out="$(node -e '
          const { detect } = require(process.env.GITHUB_WORKSPACE + "/.hashira/.github/actions/scan-suite/lib/visibility-detect.js");
          const ctx = JSON.parse(process.env.GH_CONTEXT);
          const r = detect({ ghContext: ctx, env: process.env });
          console.log(JSON.stringify(r));
        ')"
        echo "result=${out}" >> "${GITHUB_OUTPUT}"
        hasGHAS="$(echo "${out}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hasGHAS))')"
        echo "has_ghas=${hasGHAS}" >> "${GITHUB_OUTPUT}"

    - name: Skip-with-notice (private + no GHAS)
      if: steps.detect.outputs.has_ghas != 'true'
      shell: bash
      run: |
        set -euo pipefail
        msg="CodeQL requires GHAS on private repos"
        echo "::notice::scan-suite/codeql skipped: ${msg}"
        printf 'codeql\tskipped\t%s\n' "${msg}" >> "${RUNNER_TEMP}/scan-suite-results.tsv"
        echo "- codeql: skipped (${msg})" >> "${GITHUB_STEP_SUMMARY}"

    # github/codeql-action/init v3.27.5
    - name: CodeQL init
      if: steps.detect.outputs.has_ghas == 'true'
      uses: github/codeql-action/init@6825d5659bf007b85a0866e2d0f434aacf50de94
      with:
        languages: ${{ inputs.languages }}

    # github/codeql-action/analyze v3.27.5
    - name: CodeQL analyze
      id: analyze
      if: steps.detect.outputs.has_ghas == 'true'
      uses: github/codeql-action/analyze@6825d5659bf007b85a0866e2d0f434aacf50de94

    - name: Record ran-status
      if: steps.detect.outputs.has_ghas == 'true'
      shell: bash
      run: |
        set -euo pipefail
        printf 'codeql\tran\tlanguages=%s\n' "${{ inputs.languages || 'autodetect' }}" \
          >> "${RUNNER_TEMP}/scan-suite-results.tsv"
        echo "- codeql: ran (languages=${{ inputs.languages || 'autodetect' }})" >> "${GITHUB_STEP_SUMMARY}"
