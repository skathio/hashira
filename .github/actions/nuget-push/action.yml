# Composite action: nuget-push
#
# Pushes a `.nupkg` to a NuGet feed (default `https://api.nuget.org/v3/index.json`,
# per D10b unified `target`). Supports two auth shapes:
#   - API key (long-lived, passed via `api_key` input → `NUGET_API_KEY` env)
#   - OIDC trusted publishing (api_key empty): the `NuGet/login` action
#     exchanges the GitHub OIDC token for a short-lived nuget.org API key,
#     which is then handed to `dotnet nuget push --api-key`. Requires the
#     calling JOB to grant `id-token: write`, the `nuget_user` input set to
#     the nuget.org account that owns the policy, and a trusted-publishing
#     policy on nuget.org matching this repo/workflow/environment. See
#     `docs/flows/nuget.md` §7.
#
# Per NF1 the action stays under the ~80-line soft cap (no JS shim
# needed — logic is push + dry-run hook + summary).
#
# Per D4 idempotency: `--skip-duplicate` is enabled by default so a retry
# after a partial publish doesn't crash on the already-published package.
#
# Runtime contract:
#   The caller MUST have a `dotnet` CLI on PATH (typically via setup-dotnet
#   at the workflow level per D11). The caller MUST have produced a
#   `.nupkg` at `nupkg_path` (typically via `dotnet-pack-version`). The
#   caller MUST provide `api_key` (via `secrets:` block) or have OIDC
#   federation configured on the feed side.
#
# ## Trust boundary
#
# These inputs are interpolated into shell commands (bound via `env:` and
# dereferenced with quoting per the iter-2.1/2.3 pattern). Per D10d this
# is permitted but requires documented conventions: treat the values as
# TRUSTED input. Do NOT pass values derived from PR titles, issue bodies,
# branch names, commit messages, fork-author-controlled tag names, or any
# other externally controlled context — quoting cannot defend the sink.
#   - nupkg_path
#   - target
#   - api_key                (also a secret; never logged)
#   - skip_duplicate
#   - working_directory
# See `docs/usage.md` for the full trust model.
#
# ## Reserved env names
#
# `HASHIRA_NUGET_PUSH_DRY_RUN` is reserved by this library as a test-only
# override. When set to `1`, the action SKIPS the actual push and emits a
# dry-run summary line. Consumers MUST NOT set this in production — doing
# so silently turns publishes into no-ops.
name: nuget-push
description: Push a .nupkg to a NuGet feed (default nuget.org) with --skip-duplicate and OIDC support.

inputs:
  nupkg_path:
    description: "Path to the .nupkg file (or glob) to push. Trusted input — see `## Trust boundary`."
    required: true
  target:
    description: "Feed URL to push to (D10b unified `target`). Trusted input."
    required: false
    default: "https://api.nuget.org/v3/index.json"
  api_key:
    description: "NuGet API key. Pass via `secrets:` block. Empty selects the OIDC trusted-publishing path (NuGet/login). Trusted input (secret)."
    required: false
    default: ""
  nuget_user:
    description: "nuget.org username that owns the trusted-publishing policy. Used only on the OIDC path (api_key empty) as the `NuGet/login` user. Trusted input."
    required: false
    default: ""
  skip_duplicate:
    description: "If 'true', add `--skip-duplicate` to dotnet nuget push (idempotency for D4 retries). Trusted input."
    required: false
    default: "true"
  working_directory:
    description: "Directory in which to run `dotnet nuget push`. Trusted input."
    required: false
    default: "."

runs:
  using: composite
  steps:
    # OIDC trusted publishing: with no API key supplied, exchange the GitHub
    # OIDC token for a short-lived nuget.org key. Requires the calling JOB to
    # grant `id-token: write` and run in the Environment the nuget.org
    # trusted-publishing policy is scoped to. Skipped entirely when an API
    # key is provided.
    - name: NuGet trusted-publishing login (OIDC)
      if: ${{ inputs.api_key == '' }}
      id: nuget_login
      # NuGet/login v1.2.0
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      with:
        user: ${{ inputs.nuget_user }}
    - name: Push to NuGet feed
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        NP_NUPKG_PATH: ${{ inputs.nupkg_path }}
        NP_TARGET: ${{ inputs.target }}
        # NUGET_API_KEY is bound via `env:` (so the value never appears
        # in the shell-level `${{ }}` expansion log or in the workflow
        # YAML when echoed). It IS then passed to `dotnet nuget push`
        # via the `--api-key` flag on argv — `dotnet nuget push` has no
        # documented env-var fallback for the key on 8.0.x (see the
        # env: comment below). On GitHub-hosted runners (single-tenant)
        # the argv exposure is bounded. Honest trade-off per iter-3.1
        # review Minor #1.
        # NUGET_API_KEY is also exported as an env var (some dotnet tooling
        # picks it up via NuGet.config credential providers); the actual
        # `dotnet nuget push` CLI does NOT have a documented env-var
        # fallback for the API key (verified against Microsoft's published
        # `dotnet nuget push` reference for 8.0.x — only `-k|--api-key`
        # accepts it). We therefore still pass it on argv below. On the
        # GitHub-hosted ubuntu-latest runner the process is single-tenant
        # so the argv exposure is bounded; on self-hosted multi-tenant
        # runners consumers should consider a credential-provider plugin
        # instead. See iter-3.1 review Minor #1 trade-off note.
        # The API key when provided; otherwise the short-lived key minted by
        # the NuGet/login step above (OIDC trusted publishing).
        NUGET_API_KEY: ${{ inputs.api_key != '' && inputs.api_key || steps.nuget_login.outputs.NUGET_API_KEY }}
        NP_SKIP_DUP: ${{ inputs.skip_duplicate }}
      run: |
        set -euo pipefail
        filename="$(basename "${NP_NUPKG_PATH}")"

        # Dry-run hook (reserved test-only override; see header).
        if [ "${HASHIRA_NUGET_PUSH_DRY_RUN:-0}" = "1" ]; then
          echo "nuget-push: HASHIRA_NUGET_PUSH_DRY_RUN=1 -> skipping actual push"
          echo "nuget-push: dry-run; no push attempted" >> "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi

        # Build the argument list. --api-key is omitted entirely when empty
        # (OIDC path — dotnet's federated-token discovery kicks in then).
        push_args=( "${NP_NUPKG_PATH}" --source "${NP_TARGET}" )
        if [ -n "${NUGET_API_KEY}" ]; then
          push_args+=( --api-key "${NUGET_API_KEY}" )
        else
          # Reached only when api_key is empty AND the OIDC NuGet/login step
          # produced no key (e.g. nuget_user empty, the job lacked
          # `id-token: write`, or no trusted-publishing policy matched). Fail
          # fast with guidance rather than letting dotnet emit an opaque auth
          # error.
          echo "::error::nuget-push: no credential available. Provide 'api_key', OR set 'nuget_user' and grant the job 'id-token: write' with a matching nuget.org trusted-publishing policy (see docs/flows/nuget.md §7)." >&2
          exit 1
        fi
        if [ "${NP_SKIP_DUP}" = "true" ]; then
          push_args+=( --skip-duplicate )
        fi

        echo "::group::dotnet nuget push (target=${NP_TARGET})"
        # Capture stdout so we can detect the skip-duplicate path; dotnet
        # exits 0 in both fresh-push and skip-duplicate cases.
        log_file="${RUNNER_TEMP}/nuget-push.log"
        dotnet nuget push "${push_args[@]}" 2>&1 | tee "${log_file}"
        echo "::endgroup::"

        if grep -qE 'already exists at feed|409 \(Conflict\)' "${log_file}"; then
          echo "nuget-push: skipped (duplicate)" >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "nuget-push: pushed ${filename} to ${NP_TARGET}" >> "${GITHUB_STEP_SUMMARY}"
        fi
